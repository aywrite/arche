# configuration file for git-cliff
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}\
{% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | upper_first }}\
{% for footer in commit.footers %}\
{% if footer.token == "Bench" %} [bench {{ footer.value }}]\
{% elif footer.token == "Speed" %} [speed {{ footer.value | split(pat=" ") | first }}]\
{% elif footer.token == "Elo" %} [elo {{ footer.value }}]\
{% endif %}\
{% endfor %}\
    {% endfor %}
{% endfor %}\n
"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = """
<!-- generated by git-cliff -->
"""

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/aywrite/arche/pull/${2}))"},
]
# regex for parsing and grouping commits. The number in the comment orders the
# sections, the template strips it before printing the name.
commit_parsers = [
    # The version bump cargo-release makes for itself. Matched on the whole
    # message so that other work on the release tooling is still listed.
    { message = "^chore\\(release\\): prepare for ", skip = true},
    # Scopes that name part of the build rather than part of the engine, matched
    # ahead of the types so that a feat(docker) or a perf(bench) does not read
    # as a change to how the engine plays. The list is the build table in
    # docs/DEVELOPMENT.md, and scripts/tests/test_scopes.py holds them to it.
    { message = "^\\w+\\((bench|book|ci|deps(-dev)?|docker|docs|lint|release|tactics)\\)!?:", group = "<!-- 6 -->Development"},
    { message = "^feat", group = "<!-- 0 -->Features"},
    { message = "^fix", group = "<!-- 1 -->Bug Fixes"},
    { message = "^perf", group = "<!-- 2 -->Performance"},
    { message = "^refactor", group = "<!-- 3 -->Refactor"},
    { message = "^doc", group = "<!-- 4 -->Documentation"},
    { body = ".*security", group = "<!-- 5 -->Security"},
    { message = "^(build|chore|ci|style|test)", group = "<!-- 6 -->Development"},
    # Nothing should reach this. It is here so that an unrecognised type shows
    # up in the changelog rather than quietly becoming a section of its own.
    { message = ".*", group = "<!-- 7 -->Other"},
]
# filter out the commits that are not matched by commit parsers
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# regex for skipping tags
skip_tags = ""
# regex for ignoring tags
ignore_tags = "(beta|rc|alpha)"
# sort the tags chronologically
date_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
