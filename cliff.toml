# configuration file for git-cliff
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# a tera template, https://keats.github.io/tera/docs/
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}\
{% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | upper_first }}\
{% for footer in commit.footers %}\
{% if footer.token == "Bench" %} [bench {{ footer.value }}]\
{% elif footer.token == "Speed" %} [speed {{ footer.value }}]\
{% elif footer.token == "Elo" %} [elo {{ footer.value }}]\
{% endif %}\
{% endfor %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
# https://www.conventionalcommits.org
conventional_commits = true
filter_unconventional = true
split_commits = false
# link a (#123) reference to its pull request
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/aywrite/arche/pull/${2}))"},
]
# The number in the comment orders the sections, the template strips it
# before printing the name.
commit_parsers = [
    # The version bump cargo-release makes for itself. Matched on the whole
    # message so that other work on the release tooling is still listed.
    { message = "^chore\\(release\\): prepare for ", skip = true},
    # Build scopes, matched ahead of the types so that a feat(docker) or a
    # perf(bench) does not read as a change to how the engine plays. The list
    # is the build table in docs/DEVELOPMENT.md; scripts/tests/test_scopes.py
    # holds the two to each other.
    { message = "^\\w+\\((bench|book|ci|deps(-dev)?|docker|docs|lint|release|tactics|workspace)\\)!?:", group = "<!-- 6 -->Development"},
    { message = "^feat", group = "<!-- 0 -->Features"},
    { message = "^fix", group = "<!-- 1 -->Bug Fixes"},
    { message = "^perf", group = "<!-- 2 -->Performance"},
    { message = "^refactor", group = "<!-- 3 -->Refactor"},
    { message = "^doc", group = "<!-- 4 -->Documentation"},
    { body = ".*security", group = "<!-- 5 -->Security"},
    { message = "^(build|chore|ci|style|test)", group = "<!-- 6 -->Development"},
    # Nothing should reach this. It is here so that an unrecognised type shows
    # up in the changelog rather than quietly becoming a section of its own.
    { message = ".*", group = "<!-- 7 -->Other"},
]
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = "(beta|rc|alpha)"
date_order = false
sort_commits = "oldest"
