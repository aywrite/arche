# The four match tools as one installable package, so that what reads a match
# can be imported by name rather than found by sitting in the right directory.
#
# The package itself needs nothing outside the standard library. The version is
# the package's own and not the engine's, and it is printed in the --json
# output and nowhere else.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "match-tools"
version = "0.1.0"
description = "Read a sharded engine match: the pooled estimate and the ccrl fit"
# the floor the `X | None` annotations set
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Andrew Wright" }]
dependencies = []

[project.optional-dependencies]
# What the script tests need, so that ci installs the same thing a clone
# does. They were named on the pip line in the workflow and nowhere else,
# unpinned, which meant a test that needed a package nobody had listed passed
# locally for whoever happened to have it and failed in ci for everyone.
# Compatible release pins rather than exact ones: these are test tools, and
# the thing being held still is the major version whose behaviour the tests
# were written against.
#
# Two of the three are for tests of code that is not in this package. pyyaml
# serves the scope and workflow input tests, and chess reads and writes the
# epd the tactical suite is generated from, which is the same release the
# lichess image builds the opening book with. They are here because this is
# the one file the tests are installed from, and they leave with the tests
# that want them.
#
# The linting is pinned separately, by .pre-commit-config.yaml, which manages
# its own environments.
test = ["pytest~=9.1", "pyyaml~=6.0", "chess~=1.11"]

[tool.setuptools.packages.find]
# Named rather than discovered. Left to itself setuptools takes this directory
# for a flat layout and installs scripts/tests as a package called tests.
include = ["match_tools*"]
