[package]
name = "arche"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[workspace]
members = [
  "basic_engine"
]

# shared so that the release tooling has a single version to bump
[workspace.package]
version = "0.3.9-rc.2"
edition = "2024"
rust-version = "1.85"
authors = [
  "Andrew Wright"
]

[dependencies]
lazy_static = "1.5.0"
regex = "1"
basic_engine = { path = "./basic_engine" }

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true
