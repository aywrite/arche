[package]
name = "arche"
version = "0.3.6"
edition = "2021"
authors = [
  "Andrew Wright"
]

[workspace]
members = [
  "basic_engine"
]

[dependencies]
lazy_static = "1.4.0"
regex = "1"
basic_engine = { path = "./basic_engine" }
rand = "0.9.3"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true
