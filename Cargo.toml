[package]
name = "arche"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "A UCI chess engine."
repository = "https://github.com/aywrite/arche"
readme = "README.md"
publish = false

# A library as well as a binary. Everything in src/ was written to be driven
# by an interface, and a binary is reachable from nothing, so a test outside
# it had no way in. Both targets are named arche, which cargo allows and
# which keeps `--bin arche`, what the release workflow asks for, meaning what
# it always meant.
[lib]
name = "arche"
path = "src/lib.rs"

[[bin]]
name = "arche"
path = "src/main.rs"

[workspace]
members = [
  "arche-core"
]

# shared so that the release tooling has a single version to bump
[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
authors = [
  "Andrew Wright"
]
license = "GPL-3.0-or-later"

[dependencies]
arche-core = { path = "./arche-core" }

[dev-dependencies]
# already the engine's, so this adds an edge rather than a package
proptest = "1.7"

# The tests are compiled optimised. What the debug run is there for is the
# overflow checks and the board's state-in-step assertions, and cargo leaves
# both on at any optimisation level, so nothing the run checks is given up
# for the speed. Only `cargo test` reads this profile, so a plain
# `cargo build` is untouched.
[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true
