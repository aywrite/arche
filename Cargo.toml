[package]
name = "arche"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# A library as well as a binary. Everything in src/ was written to be driven
# by an interface, and a binary is reachable from nothing, so a test outside
# it had no way in. Both targets are named arche, which cargo allows and
# which keeps `--bin arche`, what the release workflow asks for, meaning what
# it always meant.
[lib]
name = "arche"
path = "src/lib.rs"

[[bin]]
name = "arche"
path = "src/main.rs"

[workspace]
members = [
  "basic_engine"
]

# shared so that the release tooling has a single version to bump
[workspace.package]
version = "0.3.10"
edition = "2024"
rust-version = "1.85"
authors = [
  "Andrew Wright"
]
license = "GPL-3.0-or-later"

[dependencies]
basic_engine = { path = "./basic_engine" }

[dev-dependencies]
# already the engine's, so this adds an edge rather than a package
proptest = "1.7"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true
