[package]
name = "arche"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "A UCI chess engine."
repository = "https://github.com/aywrite/arche"
readme = "README.md"
publish = false

# A library as well as a binary, so that a test outside src/ has a way in.
# Both targets are named arche, which cargo allows and which keeps the
# `--bin arche` the docker build and the release workflow ask for.
[lib]
name = "arche"
path = "src/lib.rs"

[[bin]]
name = "arche"
path = "src/main.rs"

# This crate speaks a protocol and drives an engine and has never needed an
# unsafe block. Forbid rather than deny, because forbid cannot be lifted by
# an `allow` further down: the only way past this line is deleting it, which
# is a diff a reader will see. The engine crate carries unsafe and says so in
# its own manifest; the code that reads what an interface sent is the code
# that should be free of it.
[lints.rust]
unsafe_code = "forbid"

[workspace]
members = [
  "arche-core"
]

# shared so that the release tooling has a single version to bump
[workspace.package]
version = "0.4.6"
edition = "2024"
rust-version = "1.85"
authors = [
  "Andrew Wright"
]
license = "GPL-3.0-or-later"

[dependencies]
arche-core = { path = "./arche-core" }

# The engine's diagnostic build, passed through so the binary can be built
# with it: `cargo build --release --features provenance`.
[features]
provenance = ["arche-core/provenance"]

[dev-dependencies]
# already the engine's, so this adds an edge rather than a package
proptest = "1.7"

# The tests are compiled optimised. The overflow checks and the board's
# state-in-step assertions stay on at any opt-level, so nothing the run
# checks is given up for the speed. Only `cargo test` reads this profile.
[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true
