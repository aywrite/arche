[package]
name = "arche"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "A UCI chess engine."
repository = "https://github.com/aywrite/arche"
readme = "README.md"
publish = false

# A library as well as a binary. Everything in src/ was written to be driven
# by an interface, and a binary is reachable from nothing, so a test outside
# it had no way in. Both targets are named arche, which cargo allows and
# which keeps `--bin arche`, what the release workflow asks for, meaning what
# it always meant.
[lib]
name = "arche"
path = "src/lib.rs"

[[bin]]
name = "arche"
path = "src/main.rs"

[workspace]
members = [
  "arche-core"
]

# shared so that the release tooling has a single version to bump
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = [
  "Andrew Wright"
]
license = "GPL-3.0-or-later"

[dependencies]
arche-core = { path = "./arche-core" }

[dev-dependencies]
# already the engine's, so this adds an edge rather than a package
proptest = "1.7"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
debug = true

# What the debug test run checks comes from the two flags below and not from
# the optimisation level, so the tests can be optimised without giving any of
# it up. They are stated rather than left to the profile's defaults, because
# losing either of them is the one way this section could do harm.
#
# Unoptimised the suite takes two and a half minutes, almost all of it the
# perft walks: tens of millions of positions, each move of them recomputing
# the board's state to compare against what was maintained. At level one it
# takes twenty six seconds and compiles eight seconds slower. Level two costs
# another forty five seconds of compiling to save one second of running.
#
# `profile.test` inherits from this, and so does the binary the session tests
# spawn, so this one setting covers the whole of `cargo test`.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true
