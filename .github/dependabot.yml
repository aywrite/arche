# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    # The workflows pin a commit sha with the version in a trailing comment,
    # because a tag is mutable and a release hands these actions a token that
    # can write to the repository and the package registry. Dependabot
    # rewrites the sha and the comment together.
    ignore:
      # The only exception: this action's ref names the rust toolchain to
      # install, not a version of the action, so a bump would raise the
      # version the msrv job checks against.
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
