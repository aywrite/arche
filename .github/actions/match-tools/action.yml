name: Match tools
description: Build fastchess and fetch the opening books, into tools/, cached between runs.

inputs:
  fastchess:
    description: The fastchess release to build
    # every fastchess release is tagged -alpha, there is no plain v1.8.2
    default: v1.8.2-alpha

outputs:
  fastchess:
    # handed back rather than read off the built binary, so a run that records
    # what it played on records the release that was asked for
    description: The fastchess release that is in tools/
    value: ${{ inputs.fastchess }}

runs:
  using: composite
  steps:
    - name: Cache the match tools
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Named one by one rather than as the whole of tools/, because a match
        # writes its games, its results and the engines it played into the same
        # directory, and caching those would mean a later run restoring an
        # earlier run's games and being able to read them as its own.
        path: |
          tools/fastchess
          tools/8moves_v3.pgn
          tools/UHO_4060_v2.epd
        # The version belongs to the input rather than to the key, so that
        # bumping it cannot leave the key naming a build it no longer describes.
        # The books are pinned at a commit of the books repository, and that pin
        # is here for the same reason: without it a changed pin would restore
        # the file fetched at the old one under the new one's name. It is
        # written out rather than read from scripts/book.sh, because the key is
        # wanted before a step has run, and test_book.py holds the two equal.
        key: match-tools-${{ inputs.fastchess }}-books-65815cc

    - name: Build the match tools
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FASTCHESS: ${{ inputs.fastchess }}
      run: |
        mkdir -p tools
        git clone --depth 1 --branch "$FASTCHESS" \
          https://github.com/Disservin/fastchess.git /tmp/fastchess
        make -C /tmp/fastchess -j"$(nproc)"
        cp /tmp/fastchess/fastchess tools/
        # Every book in the table, rather than the one a run asked for. Both of
        # them together are about four and a half megabytes, which is less than
        # an input to choose between them would be worth, and it keeps the cache
        # to one entry whichever book a run plays. Each is fetched at the pin
        # and checked against the sha256 the table names.
        while read -r book; do
          scripts/book.sh fetch "$book" tools \
            || { echo "::error::cannot fetch the ${book} book"; exit 1; }
        done < <(scripts/book.sh list)

    - name: Check the books against the table
      shell: bash
      run: |
        # However they got here. The fetch checks what it downloaded, but the
        # step above is skipped on a cache hit, and a restored file is what
        # most runs play: without this the pin would be checked on the rare
        # path and taken on trust on the usual one.
        while read -r book; do
          scripts/book.sh verify "$book" tools \
            || { echo "::error::the ${book} book is not the one it should be"; exit 1; }
        done < <(scripts/book.sh list)
