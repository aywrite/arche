name: Scripts

# The helper scripts parse other tools' output — fastchess results, the bench's
# last line, pgn files — so they rot silently when a format shifts. These
# tests are the only thing standing between that and a release note quoting
# the wrong number.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# a new push to a pull request makes the run in progress redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the script tests
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt
          python3 -m pytest scripts/tests -q
