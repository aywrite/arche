name: Coverage

# Which lines the tests reach, run by hand from the actions tab.
#
# By hand rather than on a schedule because of what it costs: instrumented,
# the suite took eighteen minutes or so, most of it the perft tests and the
# bench pin, which instrumentation slows by roughly twenty times. That was
# measured with the bench depth below nine. It is eleven now, so the timeout
# below has less room than it looks.
#
# A workflow_dispatch only appears in the actions tab once the file is on the
# default branch.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # not in rust-toolchain.toml, so a clone does not install them
      - name: Install the llvm tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # pinned for the reason the actions are
          tool: cargo-llvm-cov@0.9.0
      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage.txt
          {
            echo '### Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # --no-run reuses the profile data the step above produced
      - name: Write the lcov
        run: cargo llvm-cov --workspace --locked --no-run --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: lcov.info
