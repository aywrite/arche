name: Coverage

# Which lines the tests reach, run by hand from the actions tab when somebody
# wants to know.
#
# Its own workflow rather than a job in Rust because the trigger differs, and
# by hand rather than on a schedule because of what it costs: instrumented,
# the suite takes eighteen minutes or so, most of it the perft tests and the
# bench pin, which instrumentation slows by roughly twenty times. Their depths
# are the point of them, so there is nothing to trim, and a number that gates
# nothing should not spend that on a schedule nobody asked for. The eighteen
# was measured before the bench depth went to nine, so the timeout below has
# less room than it looks.
#
# A workflow_dispatch only appears in the actions tab once the file is on the
# default branch.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # not in rust-toolchain.toml, so a clone does not install them for
      # somebody who will never run this
      - name: Install the llvm tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          # pinned for the reason the actions are
          tool: cargo-llvm-cov@0.9.0
      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage.txt
          {
            echo '### Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # --no-run reuses the profile data the step above produced
      - name: Write the lcov
        run: cargo llvm-cov --workspace --locked --no-run --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: lcov.info
