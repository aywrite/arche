name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# a new push to a pull request makes the run in progress redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Build
      run: cargo check --workspace --locked --all-targets
    - name: Run tests
      run: cargo test --workspace --locked --release

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Run clippy
      run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # the release profile turns off the overflow checks and debug assertions, so
  # the tests are run once more without it
  test-debug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Run tests
      run: cargo test --workspace --locked

  # The tactical suite, on one platform, and gating.
  #
  # A fixed depth with a fixed table makes the count of positions the search
  # finds exact and the same on any machine, which is the property that lets
  # it fail a build rather than only print a number — the same property the
  # bench gates on. It is also ten seconds of searching here and rather more
  # on a runner, which is not worth paying for three times over a matrix that
  # would agree with itself every time.
  #
  # Ignored in the default run for that reason, so this asks for it by name.
  tactics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Run the tactical suite
      run: cargo test --release --locked -p arche-core -- --ignored the_suite_finds_what_it_found_before --nocapture
  # checks that the rust-version in the manifests is still true
  minimum-supported-rust-version:
    runs-on: ubuntu-latest
    env:
      # takes precedence over rust-toolchain.toml
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # the trailing comment on this one is a toolchain rather than a version of
    # the action: the ref names what to install, so the sha is whatever the
    # 1.85 branch pointed at, and moving it would move this job off the version
    # it exists to check. .github/dependabot.yml keeps it out of the bumps.
    - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Check the workspace
      run: cargo check --workspace --locked --all-targets
