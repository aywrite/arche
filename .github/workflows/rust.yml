name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# a new push to a pull request makes the run in progress redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Build
      run: cargo check --workspace --locked --all-targets
    - name: Run tests
      run: cargo test --workspace --locked --release

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Run clippy
      run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # the release profile turns off the overflow checks and debug assertions, so
  # the tests are run once more without it
  test-debug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Run tests
      run: cargo test --workspace --locked

  # checks that the rust-version in the manifests is still true
  minimum-supported-rust-version:
    runs-on: ubuntu-latest
    env:
      # takes precedence over rust-toolchain.toml
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@1.100
    - uses: Swatinem/rust-cache@v2
    - name: Check the workspace
      run: cargo check --workspace --locked --all-targets
