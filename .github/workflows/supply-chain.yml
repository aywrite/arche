name: Supply chain

# Runs cargo-deny over the dependency tree: advisories, licences and
# registries. What each is set to, and why cargo-deny rather than cargo-audit,
# is in deny.toml.
#
# Its own workflow because of the schedule. An advisory is published against a
# crate that has been in Cargo.lock for months, with no commit here to run a
# check, so the schedule is what turns it into a failing run and the mail
# github sends about one.
#
# github disables a scheduled workflow in a repository with no activity for
# sixty days, and says so by mail; a run from the actions tab turns it back
# on.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Monday morning UTC; a cron can run some way late, which does not matter
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# a new push to a pull request makes the run in progress redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # fetches a prebuilt cargo-deny rather than compiling one
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          # Pinned because deny.toml's fields are the ones this version
          # defines. The advisory database is still fetched at run time, which
          # is what makes the weekly run worth having. Dependabot does not
          # watch this one, so it is bumped by hand.
          tool: cargo-deny@0.20.2
      # --locked reads Cargo.lock rather than resolving afresh
      - name: Check the dependency tree
        run: cargo deny --locked check
