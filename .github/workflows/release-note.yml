name: Release note

# Adds one line to the notes of a release, for the workflows that finish after
# the release exists.
#
# Editing release notes is a read and a write rather than an append, so every
# caller takes its turn in the one queue here.

on:
  workflow_call:
    inputs:
      marker:
        description: Identifies this workflow's line so a rerun replaces it rather than adding another
        type: string
        required: true
      line:
        description: The line to add, without the marker
        type: string
        required: true

# No workflow level permissions: the one job declares what it needs, and a
# reusable workflow cannot grant itself more than its caller allowed.
jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # cancelling would lose the line rather than delay it
      group: release-notes-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Add the line to the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MARKER: ${{ inputs.marker }}
          LINE: ${{ inputs.line }}
          TAG: ${{ github.ref_name }}
        run: |
          # the marker is an html comment, so it does not render. cat -s closes
          # up the blank line the deleted line leaves behind
          body=$(gh release view "$TAG" --json body -q .body \
                 | sed "/<!-- ${MARKER} -->/d" | cat -s)
          printf '%s\n\n%s <!-- %s -->\n' "$body" "$LINE" "$MARKER" > notes.md
          gh release edit "$TAG" --notes-file notes.md
