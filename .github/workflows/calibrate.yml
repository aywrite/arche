name: Calibrate

# Estimates what the engine would be rated on the ccrl scale by playing it
# against engines that already have a rating there.
#
# The Strength workflow plays one version against another and says which is
# better. This one gives a number comparable with other engines, at the cost
# of depending on ratings earned elsewhere, on other hardware, at a slower
# time control. Treat it as a rough placement rather than a rating.
#
# A rung names an engine, a pin of that engine and the rating it holds on ccrl.
# The engines it can name are the ones scripts/opponent.sh knows how to build.
# The rungs are an input so they can be moved up as the engine improves: a
# pairing that ends 25-0 says little beyond "stronger than that".
#
# The default is eight rungs of five lineages, from 2252 to 2713, read off the
# complete ccrl blitz list of 5 September 2026. A gauntlet at this control put
# the engine at 2332, and the rungs sit either side of that figure. A rating
# belongs to the exact version the list names, which is why every rung is
# pinned at a released version.
#
# Each rung is a job playing its own slice of the book, so no two rungs open
# the same way, and the estimate job pools the games and fits one rating to all
# of them. A runner plays about one and seven tenths games a minute at 20+0.2,
# so fifty games against one opponent take about half an hour.
#
# Every rung keeps its games, its result block, the fastchess config and a
# manifest as calibrate-<run id>-<attempt>-<engine>-<pin>, so a ladder
# corrected afterwards can be refitted without playing the matches again.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: What to measure. A branch, tag, commit or pull request number. Defaults to the ref this is run against.
        type: string
      games:
        description: Games against each opponent, rounded down to an even number
        type: number
        default: 50
      time_control:
        description: Passed to fastchess as tc
        type: string
        default: 20+0.2
      book:
        description: The opening set the run plays, one of the books in scripts/book.sh. Figures on different books are not comparable.
        type: string
        default: 8moves_v3
      ladder:
        description: Opponents to play, as engine, pin and ccrl blitz rating (goldfish:v2.1.1:2252,stash:v17.0:2297)
        type: string
        default: goldfish:v2.1.1:2252,stash:v17.0:2297,sofcheck:v0.9-beta:2384,stash:v19.0:2473,stash:v20.0.1:2511,tantabus:v2.0.0:2555,weiss:v0.9:2650,stash:v21.0:2713
      seed:
        description: Seed for the region of the book the rungs play, an unsigned integer. Left empty it is the run id, and either way the manifests record it.
        type: string
  workflow_call:
    inputs:
      candidate:
        type: string
        required: false
      games:
        type: number
        default: 50
      time_control:
        type: string
        default: 20+0.2
      book:
        type: string
        default: 8moves_v3
      ladder:
        type: string
        default: goldfish:v2.1.1:2252,stash:v17.0:2297,sofcheck:v0.9-beta:2384,stash:v19.0:2473,stash:v20.0.1:2511,tantabus:v2.0.0:2555,weiss:v0.9:2650,stash:v21.0:2713
      seed:
        type: string
      publish:
        description: Append the result to the release notes for this tag
        type: boolean
        default: false
      # Not a box above: a run from the actions tab plays this repository's
      # engine, and the name only matters to a workflow calling this from
      # elsewhere.
      engine_name:
        description: The name the engine being measured plays under
        type: string
        default: arche
      # What the rungs are played on rather than what they play, so not boxes
      # on the actions tab either.
      hash_mb:
        description: The table both sides are given, in MB
        type: number
        default: 256
      concurrency:
        description: Games a rung plays at once
        type: number
        default: 2
      max_match_minutes:
        description: The wall clock cap on play alone
        type: number
        default: 90
      startup_ms:
        description: How long fastchess waits for an engine to answer uci
        type: number
        default: 20000
      # Marks this workflow's line in the release notes, so a rerun replaces
      # its own line. The job below repeats the default, as the env lines that
      # read the other call inputs do.
      marker:
        description: Identifies this workflow's line in the release notes
        type: string
        default: arche:rating

permissions:
  contents: read

env:
  # The estimate is fitted by reading the games for a player of this name, so
  # the binary, the pgn and the estimate all have to use the one value. ENGINE
  # in the play job is the opponent's.
  #
  # A workflow_call default is not applied to a run started from the actions
  # tab, so every default below is written here as well as on the input.
  ENGINE_NAME: ${{ inputs.engine_name || 'arche' }}
  # 256MB is what ccrl rates an engine with and what this one defaults to. An
  # engine that declares a smaller maximum is not sent it and plays on its own
  # default, which its result block records.
  HASH: ${{ inputs.hash_mb || 256 }}
  CONCURRENCY: ${{ inputs.concurrency || 2 }}
  # The wall clock cap on play alone; the play job's timeout is this plus half
  # an hour for the two builds. Fifty games at 20+0.2 is about half an hour,
  # so this is headroom rather than a budget.
  MAX_MATCH_MINUTES: ${{ inputs.max_match_minutes || 90 }}
  # The engine allocates its table before it answers uci, which can take
  # longer than the ten second default.
  STARTUP_MS: ${{ inputs.startup_ms || 20000 }}

jobs:
  # The ladder is a string and a matrix is a list, so it is picked apart here
  # once. The candidate ref becomes a commit here too, so every rung measures
  # the same build.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      candidate_sha: ${{ steps.find.outputs.candidate_sha }}
      rungs: ${{ steps.split.outputs.rungs }}
      count: ${{ steps.split.outputs.count }}
      pairs: ${{ steps.split.outputs.pairs }}
      spec: ${{ steps.split.outputs.spec }}
      book: ${{ steps.book.outputs.book }}
      play_timeout: ${{ steps.timeout.outputs.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out what is being measured
        id: find
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ -n "$CANDIDATE" ]; then
            sha=$(scripts/resolve_ref.sh "$CANDIDATE") \
              || { echo "::error::cannot resolve candidate ${CANDIDATE}"; exit 1; }
          else
            sha=$GITHUB_SHA
          fi
          echo "candidate_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Work out the rungs
        id: split
        env:
          GAMES: ${{ inputs.games }}
          LADDER: ${{ inputs.ladder }}
        run: |
          # whole pairs, an opening from each side, so rounded down to even
          pairs=$((GAMES / 2))
          if [ "$pairs" -lt 1 ]; then
            echo "::error::${GAMES} games against an opponent is under a pair"
            exit 1
          fi
          # an engine with no block is refused here, before a runner builds
          known=$(scripts/opponent.sh list | tr '\n' ' ')
          rungs=""
          spec=""
          named=" "
          index=0
          # split on the commas alone: splitting on whitespace would let a *
          # in the ladder glob the checkout. Newlines are joined first, since
          # read stops at one and would silently drop the rungs after it
          IFS=, read -r -a entries <<< "${LADDER//$'\n'/,}"
          for rung in "${entries[@]}"; do
            # spaces after the commas and a trailing comma are not faults
            rung=${rung// /}
            [ -n "$rung" ] || continue
            IFS=: read -r engine tag rating extra <<< "$rung"
            if [ -z "$engine" ] || [ -z "$tag" ] || [ -z "$rating" ] \
              || [ -n "$extra" ]; then
              echo "::error::ladder entry ${rung} is not engine:tag:rating"
              exit 1
            fi
            case " ${known} " in
              *" ${engine} "*) ;;
              *) echo "::error::ladder entry ${rung} names ${engine}, which is"\
                   "not one of ${known}"; exit 1 ;;
            esac
            # the tag is part of a file name, an artifact name and the name
            # the engine plays under
            case "$tag" in
              *[!A-Za-z0-9._-]*)
                echo "::error::ladder entry ${rung} has a tag that is not a name"
                exit 1 ;;
            esac
            case "$rating" in
              *[!0-9.]*|*.*.*|.)
                echo "::error::${rung} has no rating on it"; exit 1 ;;
            esac
            # a repeated engine and pin would upload twice under one artifact
            # name and be counted once
            case "$named" in
              *" ${engine}-${tag} "*)
                echo "::error::${engine}-${tag} is in the ladder twice"; exit 1 ;;
            esac
            named="${named}${engine}-${tag} "
            rungs="${rungs}${rungs:+,}"
            rungs="${rungs}{\"engine\":\"${engine}\",\"tag\":\"${tag}\""
            rungs="${rungs},\"rating\":\"${rating}\",\"index\":${index}}"
            # the estimate's ladder has to carry the names the games do
            spec="${spec}${spec:+,}${engine}-${tag}:${rating}"
            index=$((index + 1))
          done
          if [ "$index" -eq 0 ]; then
            echo "::error::the ladder is empty"
            exit 1
          fi
          echo "rungs=[${rungs}]" >> "$GITHUB_OUTPUT"
          echo "count=${index}" >> "$GITHUB_OUTPUT"
          echo "pairs=${pairs}" >> "$GITHUB_OUTPUT"
          echo "spec=${spec}" >> "$GITHUB_OUTPUT"
          if [ "$index" = "1" ]; then
            echo "::notice::one rung of $((pairs * 2)) games: ${LADDER}"
          else
            echo "::notice::${index} rungs of $((pairs * 2)) games each: ${LADDER}"
          fi

      # A book scripts/book.sh has no block for is refused here rather than by
      # a rung that has already built an opponent.
      - name: Work out the book
        id: book
        env:
          BOOK: ${{ inputs.book }}
        run: |
          # held rather than piped into grep, so grep -q leaving early cannot
          # fail the step under pipefail. -F and -x, so a box holding a
          # metacharacter or nothing is an unknown name rather than a pattern
          known=$(scripts/book.sh list)
          if ! grep -Fxq -- "$BOOK" <<< "$known"; then
            echo "::error::book ${BOOK} is not one of $(tr '\n' ' ' <<< "$known")"
            exit 1
          fi
          echo "::notice::playing the ${BOOK} book"
          echo "book=${BOOK}" >> "$GITHUB_OUTPUT"

      # A job timeout takes an expression but expressions have no arithmetic,
      # so the cap and the half hour over it are added here.
      - name: Work out how long a rung is given
        id: timeout
        run: echo "minutes=$((MAX_MATCH_MINUTES + 30))" >> "$GITHUB_OUTPUT"

  play:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      # a rung that fell over is missing from the fit, not a lost run
      fail-fast: false
      matrix:
        rung: ${{ fromJSON(needs.resolve.outputs.rungs) }}
    # without a name a matrix job is named for every value in its entry
    name: play ${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
    defaults:
      run:
        # naming the shell turns on pipefail, without which a fastchess that
        # died is hidden by the tee it is piped into
        shell: bash
    env:
      ENGINE: ${{ matrix.rung.engine }}
      TAG: ${{ matrix.rung.tag }}
      # the opponent's name in the match, the games, the artifact and the
      # estimate's ladder. The engine is in it because two engines can share
      # a version string
      OPPONENT: ${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
      RATING: ${{ matrix.rung.rating }}
      INDEX: ${{ matrix.rung.index }}
      RUNGS: ${{ needs.resolve.outputs.count }}
      PAIRS: ${{ needs.resolve.outputs.pairs }}
      TIME_CONTROL: ${{ inputs.time_control }}
      BOOK: ${{ needs.resolve.outputs.book }}
      # the seed picks the region of the book each rung plays, not a shuffle.
      # The run id is one no two runs share; a seed given by hand replays an
      # earlier run
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE: ${{ inputs.candidate }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aywrite/mache/actions/setup@26b95951ba6103ff840c2cee5659dc3ec79b5dd9 # v0.1.0
        id: tools

      # the cache keeps the dependencies; the engine is built from an export
      # of its commit
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the engine
        run: |
          # a pull request head is not fetched by default, and the resolve
          # job's fetch was on another machine
          git cat-file -e "${CANDIDATE_SHA}^{commit}" 2>/dev/null \
            || git fetch -q origin "$CANDIDATE_SHA" \
            || git fetch -q origin "+refs/pull/*/head:refs/remotes/pull/*"
          scripts/build_at.sh "$CANDIDATE_SHA" "tools/${ENGINE_NAME}"

      # Not cached: the opponents compile in a second to half a minute, less
      # than fetching a cache costs.
      - name: Build the opponent
        run: |
          scripts/opponent.sh build "$ENGINE" "$TAG" "tools/${OPPONENT}" \
            || { echo "::error::cannot build ${OPPONENT}"; exit 1; }
          ls -l "tools/${OPPONENT}"

      # The book is counted rather than written down, so a book that changed
      # size cannot move every rung but the first onto its neighbour's
      # openings. scripts/book.sh is asked rather than grep because what an
      # opening is depends on the format. The file and the format are carried
      # on because the match runs in tools/, where the script is not.
      - name: Work out the slice of the book
        run: |
          book_file=$(scripts/book.sh file "$BOOK")
          book_format=$(scripts/book.sh format "$BOOK")
          openings=$(scripts/book.sh count "$BOOK" "tools/${book_file}") \
            || { echo "::error::no openings in the book"; exit 1; }
          start=$(python3 -m mache.book_slice --openings "$openings" \
            --pairs "$PAIRS" --shards "$RUNGS" --shard "$INDEX" --seed "$SEED" \
            2> slice.txt) || { echo "::error::$(cat slice.txt)"; exit 1; }
          while read -r remark; do
            echo "::warning::${remark}"
          done < slice.txt
          echo "BOOK_FILE=${book_file}" >> "$GITHUB_ENV"
          echo "BOOK_FORMAT=${book_format}" >> "$GITHUB_ENV"
          echo "OPENINGS=${openings}" >> "$GITHUB_ENV"
          echo "START=${start}" >> "$GITHUB_ENV"

      - name: Play the rung
        working-directory: tools
        run: |
          # fastchess appends to a pgn it is given, and a rerun on the same
          # runner can find the last attempt's here
          rm -f games.pgn result.txt config.json
          # fastchess will not send a Hash an engine declares itself unable to
          # take; such an opponent plays on its own default and the result
          # block says so. tbhits is left off the pgn: no tablebases here.
          #
          # INT asks fastchess to stop, report the games so far and exit, and
          # 124 is how timeout says it sent it. A rung stopped that way has
          # fewer games in the fit, and the estimate says so
          status=0
          timeout -k 60 -s INT "${MAX_MATCH_MINUTES}m" ./fastchess \
            -engine "name=${ENGINE_NAME}" "cmd=./${ENGINE_NAME}" \
            -engine "name=${OPPONENT}" "cmd=./${OPPONENT}" \
            -each proto=uci "tc=$TIME_CONTROL" "option.Hash=$HASH" \
            -startup-ms "$STARTUP_MS" \
            -openings "file=$BOOK_FILE" "format=$BOOK_FORMAT" order=sequential "start=$START" \
            -rounds "$PAIRS" -repeat -concurrency "$CONCURRENCY" -recover \
            -pgnout file=games.pgn nodes=true seldepth=true nps=true \
              hashfull=true timeleft=true latency=true pv=true \
            | tee result.txt || status=$?
          if [ "$status" = "124" ]; then
            echo "STOPPED_BY=the ${MAX_MATCH_MINUTES} minute wall clock cap" >> "$GITHUB_ENV"
            echo "::warning::${OPPONENT} hit the ${MAX_MATCH_MINUTES} minute cap before its game count"
          elif [ "$status" != "0" ]; then
            exit "$status"
          else
            echo "STOPPED_BY=fastchess, at the game count" >> "$GITHUB_ENV"
          fi

      # What it would take to play this rung again. Written whether or not it
      # finished, since a rung that ended badly is the one looked into.
      - name: Write the manifest
        if: always()
        env:
          FASTCHESS: ${{ steps.tools.outputs.fastchess }}
          MACHE: ${{ steps.tools.outputs.version }}
        run: |
          # asked for again, since the slice step may not have run
          book_file=$(scripts/book.sh file "$BOOK") || book_file=unknown
          book_sha=$(sha256sum "tools/${book_file}" | cut -d' ' -f1) || book_sha=unknown
          toolchain=$(rustc -V) || toolchain=unknown
          repository=$(scripts/opponent.sh repository "$ENGINE") || repository=unknown
          {
            echo "candidate: ${CANDIDATE:-${GITHUB_REF_NAME}}"
            echo "candidate_sha: ${CANDIDATE_SHA}"
            echo "opponent: ${OPPONENT}"
            echo "opponent_repository: ${repository}"
            echo "opponent_pin: ${TAG}"
            echo "opponent_rating: ${RATING} on the ccrl blitz list"
            echo "build: scripts/build_at.sh for ${ENGINE_NAME}, scripts/opponent.sh for ${ENGINE}"
            echo "fastchess: ${FASTCHESS}"
            # the tooling that reads the games, so a figure can be read back
            # against the version that produced it
            echo "mache: ${MACHE}"
            echo "book: ${book_file}"
            echo "book_sha256: ${book_sha}"
            echo "book_openings: ${OPENINGS:-not counted, the rung did not get that far}"
            echo "seed: ${SEED}"
            echo "rung: ${INDEX} of ${RUNGS}"
            echo "start: ${START:-not chosen, the rung did not get that far}"
            echo "pairs: ${PAIRS}"
            echo "games_asked: $((PAIRS * 2))"
            echo "time_control: ${TIME_CONTROL}"
            # asked rather than given: an engine that declares a smaller
            # maximum plays on its own default
            echo "hash_mb_asked: ${HASH}"
            echo "concurrency: ${CONCURRENCY}"
            echo "startup_ms: ${STARTUP_MS}"
            echo "wall_clock_cap_minutes: ${MAX_MATCH_MINUTES}"
            # unset when the play step never reached its end
            echo "stopped_by: ${STOPPED_BY:-not recorded, the rung did not finish}"
            echo "runner: $(uname -a)"
            echo "cores: $(nproc)"
            echo "rustc: ${toolchain}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > tools/manifest.txt
          cat tools/manifest.txt

      # The estimate job reads the games from here. The attempt is in the
      # name because an artifact cannot be uploaded twice under one name.
      - name: Keep the games
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibrate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
          path: |
            tools/games.pgn
            tools/result.txt
            tools/config.json
            tools/manifest.txt
          if-no-files-found: warn
          # The maximum a public repository allows, written down because it is
          # the tuning corpus's shelf life: an expired games artifact cannot be
          # played again, and an implicit default can be lowered for the
          # repository by someone thinking about disk.
          retention-days: 90

  estimate:
    needs: [resolve, play]
    # runs on whatever arrived; the fit says which rungs played no games
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      line: ${{ steps.estimate.outputs.line }}
    env:
      TIME_CONTROL: ${{ inputs.time_control }}
      LADDER_SPEC: ${{ needs.resolve.outputs.spec }}
      RUNGS: ${{ needs.resolve.outputs.count }}
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # no harness to build and no book to fetch: this job only reads games
      - uses: aywrite/mache/actions/setup@26b95951ba6103ff840c2cee5659dc3ec79b5dd9 # v0.1.0
        with:
          estimator_only: true

      # one directory per artifact under rungs/, except that a single artifact
      # is extracted straight into rungs/; the find below takes either. The
      # attempt is in the pattern so a rerun does not count an earlier
      # attempt's games as well
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: calibrate-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: rungs

      - name: Work out the rating
        id: estimate
        run: |
          mapfile -t games < <(find rungs -name games.pgn 2>/dev/null | sort)
          if [ "${#games[@]}" -eq 0 ]; then
            echo "::error::no rung of attempt ${GITHUB_RUN_ATTEMPT} uploaded any games. Rerunning the failed jobs alone leaves the games on the attempt that played them, so rerun all of them."
            exit 1
          fi
          cat "${games[@]}" > gauntlet.pgn
          # how the games ended, counted from the games. Games lost to a crash
          # or the clock stay in the fit, because choosing what to count after
          # seeing it is not a measurement; the counts sit beside the estimate
          if python3 -m mache.match_terminations gauntlet.pgn \
              > terminations.txt 2> faults.txt; then
            while read -r remark; do
              echo "::warning::${remark}"
            done < faults.txt
          else
            echo "::warning::The games could not be counted, the block below is incomplete"
            cat faults.txt
          fi
          # the estimate's remarks (a rung that played no games, a fit the
          # pairings disagree with) come back on stderr
          python3 -m mache.rating_estimate \
            gauntlet.pgn "$ENGINE_NAME" "$LADDER_SPEC" > table.md 2> notes.txt \
            || { cat notes.txt >&2; exit 1; }
          # to the log as well as the summary: the summary is read from the
          # run's web page and nowhere else, and the artifacts expire
          cat table.md
          # asked for again rather than cut out of the table, so a change to
          # the table's layout cannot quietly change what is published
          line=$(python3 -m mache.rating_estimate \
            gauntlet.pgn "$ENGINE_NAME" "$LADDER_SPEC" --line 2> /dev/null)
          echo "line=Estimated rating | ${line}" >> "$GITHUB_OUTPUT"
          echo "::notice::${line}"
          while read -r remark; do
            echo "::warning::${remark}"
          done < notes.txt
          {
            echo "### Rating estimate"
            echo
            echo "\`${CANDIDATE_SHA:0:8}\` at ${TIME_CONTROL} against engines with a"
            echo "rating on the [ccrl](https://computerchess.org.uk/) blitz list,"
            echo "${#games[@]} of ${RUNGS} rungs played."
            echo
            cat table.md
            # one alert holding every remark: one alert each renders as the
            # first alert with the rest of the markup showing through as text
            if [ -s notes.txt ]; then
              echo
              echo "> [!WARNING]"
              sed 's/^/> /' notes.txt
            fi
            echo
            echo "How the games ended:"
            echo
            echo '```'
            cat terminations.txt
            echo '```'
            echo
            echo "The games of each rung are kept as the"
            echo "\`calibrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-<engine>-<pin>\` artifacts, with a manifest"
            echo "saying what was played on what. The openings came from seed ${SEED},"
            echo "which replays this schedule."
            echo
            echo "The opponents were rated at 2m+1s on other hardware, so the"
            echo "placement carries a systematic error the game count does not"
            echo "describe. It is worth about a hundred points, and no number of"
            echo "games reduces it."
          } >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    needs: estimate
    if: inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
    with:
      marker: ${{ inputs.marker || 'arche:rating' }}
      line: ${{ needs.estimate.outputs.line }}
