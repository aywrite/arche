name: Calibrate

# Estimates what the engine would be rated on the ccrl scale by playing it
# against engines that already have a rating there.
#
# This is not the same question as the Strength workflow answers. That one plays
# a version against another version and says which is better, which is what a
# change wants to know and says nothing about where either of them sits. This
# one gives a number that can be compared with other engines, at the cost of
# depending on ratings earned elsewhere, on other hardware, at a slower time
# control. Treat it as a rough placement rather than a rating.
#
# A rung names an engine, a pin of that engine and the rating it holds on ccrl.
# The engines it can name are the ones scripts/opponent.sh knows how to build,
# which is where a new opponent is added. The rungs are an input so they can be
# moved up as the engine improves: a pairing that ends 25-0 says little beyond
# "stronger than that", so the useful opponents are the ones close enough to
# take games off.
#
# The default is eight rungs of five lineages, from 2168 to 2555. A gauntlet at
# this control put the engine at 2332, and the rungs sit either side of that
# figure rather than all below it. They were read off the complete ccrl blitz
# list of 5 September 2026. A rating belongs to the exact version the list
# names, which is why every rung is pinned at a released version.
#
# A rung is a job. A runner plays about one and seven tenths games a minute at
# 20+0.2, so the default fifty games against one opponent take about half an
# hour, and the rungs played one after another would take about four hours of
# wall clock for no reason: they share nothing but the openings.
# Each rung now plays its own match, on its own slice of the book so that no
# two of them play the same opening, and a job at the end pools the games and
# fits the one rating to all of them.
#
# Every rung keeps its games, its result block, the fastchess config and a
# manifest as calibrate-<run id>-<attempt>-<engine>-<pin>. The games are the
# expensive part and the fit is cheap, so a ladder corrected afterwards can be
# applied to them without playing the matches again.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: What to measure. A branch, tag, commit or pull request number. Defaults to the ref this is run against.
        type: string
      games:
        description: Games against each opponent, rounded down to an even number
        type: number
        default: 50
      time_control:
        description: Passed to fastchess as tc
        type: string
        default: 20+0.2
      book:
        description: The opening set the run plays, one of the books in scripts/book.sh. Figures on different books are not comparable.
        type: string
        default: 8moves_v3
      ladder:
        description: Opponents to play, as engine, pin and ccrl blitz rating (goldfish:v2.1.1:2252,stash:v17.0:2297)
        type: string
        default: zagreus:v5.0:2168,stash:v15.3:2173,goldfish:v2.1.1:2252,stash:v17.0:2297,sofcheck:v0.9-beta:2384,stash:v19.0:2473,stash:v20.0.1:2511,tantabus:v2.0.0:2555
      seed:
        description: Seed for the region of the book the rungs play, an unsigned integer. Left empty it is the run id, and either way the manifests record it.
        type: string
  workflow_call:
    inputs:
      candidate:
        type: string
        required: false
      games:
        type: number
        default: 50
      time_control:
        type: string
        default: 20+0.2
      book:
        type: string
        default: 8moves_v3
      ladder:
        type: string
        default: zagreus:v5.0:2168,stash:v15.3:2173,goldfish:v2.1.1:2252,stash:v17.0:2297,sofcheck:v0.9-beta:2384,stash:v19.0:2473,stash:v20.0.1:2511,tantabus:v2.0.0:2555
      seed:
        type: string
      publish:
        description: Append the result to the release notes for this tag
        type: boolean
        default: false
      # Not a box above. A run from the actions tab is a run of this
      # repository's engine, and the name it plays under is only a question
      # for a workflow calling this from somewhere else.
      engine_name:
        description: The name the engine being measured plays under
        type: string
        default: arche
      # What the rungs are played on rather than what they play. These are
      # workflow_call inputs for the reason engine_name is: what a person
      # running this from the actions tab comes to change is the ladder or
      # the games. A workflow calling this can name them.
      hash_mb:
        description: The table both sides are given, in MB
        type: number
        default: 256
      concurrency:
        description: Games a rung plays at once
        type: number
        default: 2
      max_match_minutes:
        description: The wall clock cap on play alone
        type: number
        default: 90
      startup_ms:
        description: How long fastchess waits for an engine to answer uci
        type: number
        default: 20000
      # What the release note this run writes is marked with, so a rerun
      # replaces its own line rather than adding a second one. The job below
      # repeats the default, as the env lines that read the other call inputs
      # do, so the marker holds if publish is ever a box on the actions tab
      # as well.
      marker:
        description: Identifies this workflow's line in the release notes
        type: string
        default: arche:rating

permissions:
  contents: read

env:
  # What the engine being measured plays under. The estimate is fitted by
  # reading the games for a player of this name, so the name it plays under
  # and the name the estimate is told to look for have to be the one value.
  # The binary is built under it too, which keeps what is on disk and what is
  # in the pgn the same. ENGINE in the play job is the opponent's, which is a
  # different thing.
  #
  # A workflow_call default is not applied to a run started from the actions
  # tab, so the default is here as well as on the input.
  ENGINE_NAME: ${{ inputs.engine_name || 'arche' }}
  # What the rungs are played on, from the inputs above and with their
  # defaults written here for the same reason.
  #
  # 256MB is what ccrl gives an engine and what this one defaults to, so a rung
  # is played on the table its opponent was rated with. An engine that declares
  # a smaller maximum is not sent it at all and plays on its own default, which
  # its result block records. Naming the size once here is what puts it in every
  # manifest as well as in the match.
  HASH: ${{ inputs.hash_mb || 256 }}
  CONCURRENCY: ${{ inputs.concurrency || 2 }}
  # The wall clock cap on play alone. The play job's timeout is worked out from
  # it with half an hour over, which is what the two builds before the match
  # run in. Fifty games at 20+0.2 is about half an hour, so this is headroom
  # for a slow runner or a longer control rather than a budget to be spent.
  MAX_MATCH_MINUTES: ${{ inputs.max_match_minutes || 90 }}
  # The engine allocates its table before it answers uci, which takes it
  # several seconds and the ten second default does not always allow for.
  STARTUP_MS: ${{ inputs.startup_ms || 20000 }}

jobs:
  # The ladder is a string, and a matrix is a list, so the string is picked
  # apart here rather than in every job that needs a piece of it. It is also
  # where the engine's ref becomes a commit, so the rungs all measure the same
  # build rather than each resolving the ref again.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      candidate_sha: ${{ steps.find.outputs.candidate_sha }}
      rungs: ${{ steps.split.outputs.rungs }}
      count: ${{ steps.split.outputs.count }}
      pairs: ${{ steps.split.outputs.pairs }}
      spec: ${{ steps.split.outputs.spec }}
      book: ${{ steps.book.outputs.book }}
      play_timeout: ${{ steps.timeout.outputs.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out what is being measured
        id: find
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ -n "$CANDIDATE" ]; then
            sha=$(scripts/resolve_ref.sh "$CANDIDATE") \
              || { echo "::error::cannot resolve candidate ${CANDIDATE}"; exit 1; }
          else
            sha=$GITHUB_SHA
          fi
          echo "candidate_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Work out the rungs
        id: split
        env:
          GAMES: ${{ inputs.games }}
          LADDER: ${{ inputs.ladder }}
        run: |
          # every rung plays whole pairs, an opening from each side, so its
          # games are rounded down to an even number
          pairs=$((GAMES / 2))
          if [ "$pairs" -lt 1 ]; then
            echo "::error::${GAMES} games against an opponent is under a pair"
            exit 1
          fi
          # the engines the build table knows. A ladder that names one it does
          # not is refused here, before a runner is asked to build anything
          known=$(scripts/opponent.sh list | tr '\n' ' ')
          rungs=""
          spec=""
          named=" "
          index=0
          # split on the commas alone. Splitting on whitespace would let a
          # * in the ladder become one rung per file in the checkout, and the
          # error would name a file rather than what was typed. A ladder pasted
          # over several lines is joined first, since read stops at a newline
          # and would drop every rung after the first line without saying so
          IFS=, read -r -a entries <<< "${LADDER//$'\n'/,}"
          for rung in "${entries[@]}"; do
            # a ladder typed with spaces after its commas is ordinary, and so
            # is a trailing comma, which is nothing to play rather than a fault
            rung=${rung// /}
            [ -n "$rung" ] || continue
            IFS=: read -r engine tag rating extra <<< "$rung"
            if [ -z "$engine" ] || [ -z "$tag" ] || [ -z "$rating" ] \
              || [ -n "$extra" ]; then
              echo "::error::ladder entry ${rung} is not engine:tag:rating"
              exit 1
            fi
            case " ${known} " in
              *" ${engine} "*) ;;
              *) echo "::error::ladder entry ${rung} names ${engine}, which is"\
                   "not one of ${known}"; exit 1 ;;
            esac
            # the tag is part of a file name, of an artifact name and of the
            # name the engine plays under, so it is held to what all three take
            case "$tag" in
              *[!A-Za-z0-9._-]*)
                echo "::error::ladder entry ${rung} has a tag that is not a name"
                exit 1 ;;
            esac
            case "$rating" in
              *[!0-9.]*|*.*.*|.)
                echo "::error::${rung} has no rating on it"; exit 1 ;;
            esac
            # two rungs of one engine and pin would play the same opponent
            # twice, upload twice under one artifact name and be counted once
            case "$named" in
              *" ${engine}-${tag} "*)
                echo "::error::${engine}-${tag} is in the ladder twice"; exit 1 ;;
            esac
            named="${named}${engine}-${tag} "
            # the matrix takes a list of objects, one per rung, so a job can
            # read the engine, the pin and the rating it is playing straight
            # off its own
            rungs="${rungs}${rungs:+,}"
            rungs="${rungs}{\"engine\":\"${engine}\",\"tag\":\"${tag}\""
            rungs="${rungs},\"rating\":\"${rating}\",\"index\":${index}}"
            # the engines play under their engine and pin, so the ladder the
            # estimate is given has to carry the same names the games do
            spec="${spec}${spec:+,}${engine}-${tag}:${rating}"
            index=$((index + 1))
          done
          if [ "$index" -eq 0 ]; then
            echo "::error::the ladder is empty"
            exit 1
          fi
          echo "rungs=[${rungs}]" >> "$GITHUB_OUTPUT"
          echo "count=${index}" >> "$GITHUB_OUTPUT"
          echo "pairs=${pairs}" >> "$GITHUB_OUTPUT"
          echo "spec=${spec}" >> "$GITHUB_OUTPUT"
          if [ "$index" = "1" ]; then
            echo "::notice::one rung of $((pairs * 2)) games: ${LADDER}"
          else
            echo "::notice::${index} rungs of $((pairs * 2)) games each: ${LADDER}"
          fi

      # The book the rungs play. The names are the blocks in scripts/book.sh,
      # which is also where the file, the format and the sha256 come from, and
      # a name it does not know is refused here rather than by a rung that has
      # already built an opponent.
      - name: Work out the book
        id: book
        env:
          BOOK: ${{ inputs.book }}
        run: |
          # the list is held rather than piped into grep, so that grep -q
          # leaving early cannot fail the step under pipefail. -F and -x, so a
          # box holding a metacharacter or nothing at all is a name the table
          # does not have rather than a pattern
          known=$(scripts/book.sh list)
          if ! grep -Fxq -- "$BOOK" <<< "$known"; then
            echo "::error::book ${BOOK} is not one of $(tr '\n' ' ' <<< "$known")"
            exit 1
          fi
          echo "::notice::playing the ${BOOK} book"
          echo "book=${BOOK}" >> "$GITHUB_OUTPUT"

      # How long a rung is given. A job timeout takes an expression but
      # expressions have no arithmetic, so the cap and the half hour over it
      # are added up here.
      - name: Work out how long a rung is given
        id: timeout
        run: echo "minutes=$((MAX_MATCH_MINUTES + 30))" >> "$GITHUB_OUTPUT"

  play:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      # a rung that fell over is a rung missing from the fit and not a lost
      # run, so the others play on and the estimate says which of them arrived
      fail-fast: false
      matrix:
        rung: ${{ fromJSON(needs.resolve.outputs.rungs) }}
    # without this a job is named for every value in its matrix entry, which
    # reads as play (bbc, 2, 1.1, 2018) and says nothing at a glance
    name: play ${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
    # the play cap with room for the two builds before it, worked out in
    # resolve
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
    defaults:
      run:
        # naming the shell is what turns on pipefail, without it a fastchess
        # that died is hidden by the tee it is piped into
        shell: bash
    env:
      ENGINE: ${{ matrix.rung.engine }}
      TAG: ${{ matrix.rung.tag }}
      # what the opponent is called everywhere downstream: in the match, in the
      # games, in the artifact and in the ladder the estimate is fitted with.
      # The engine is in it because two engines can share a version string
      OPPONENT: ${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
      RATING: ${{ matrix.rung.rating }}
      INDEX: ${{ matrix.rung.index }}
      RUNGS: ${{ needs.resolve.outputs.count }}
      PAIRS: ${{ needs.resolve.outputs.pairs }}
      TIME_CONTROL: ${{ inputs.time_control }}
      # the book the resolve job accepted rather than the input it read, so a
      # rung plays what was checked
      BOOK: ${{ needs.resolve.outputs.book }}
      # the openings are taken in book order from an offset, so the seed picks
      # the region of the book each rung plays rather than a shuffle. The run
      # id is one nobody has to choose and no two runs share; a seed given by
      # hand replays an earlier run
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE: ${{ inputs.candidate }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/match-tools
        id: tools

      # the cache keeps the dependencies; the engine is built from an export
      # of its commit, and the checkout stays on the ref this ran on
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the engine
        run: |
          # a pull request head is not fetched by default and the resolve job
          # ran on a different machine, so fetch it if it is not already here
          git cat-file -e "${CANDIDATE_SHA}^{commit}" 2>/dev/null \
            || git fetch -q origin "$CANDIDATE_SHA" \
            || git fetch -q origin "+refs/pull/*/head:refs/remotes/pull/*"
          scripts/build_at.sh "$CANDIDATE_SHA" "tools/${ENGINE_NAME}"

      # Not cached. The engines in the table take from a second to about half
      # a minute to compile, so fetching a cache would cost more than building
      # one does. Where each comes from and how it is built is in
      # scripts/opponent.sh, which is also what a new opponent is added to.
      - name: Build the opponent
        run: |
          scripts/opponent.sh build "$ENGINE" "$TAG" "tools/${OPPONENT}" \
            || { echo "::error::cannot build ${OPPONENT}"; exit 1; }
          ls -l "tools/${OPPONENT}"

      # Which openings this rung plays. The rungs are the shards of the run:
      # each takes a slice of its own so that no two of them open the same
      # way, which keeps the pairings independent of each other. The book is
      # counted here rather than written down, because a book that changed
      # size would otherwise move every rung but the first onto its
      # neighbour's openings. What counting means depends on the book, a game
      # for a pgn and a line for an epd, which is why scripts/book.sh is asked
      # rather than grep. The file and the format are carried on from here
      # because the match runs in tools/, where the script is not.
      - name: Work out the slice of the book
        run: |
          book_file=$(scripts/book.sh file "$BOOK")
          book_format=$(scripts/book.sh format "$BOOK")
          openings=$(scripts/book.sh count "$BOOK" "tools/${book_file}") \
            || { echo "::error::no openings in the book"; exit 1; }
          start=$(python3 scripts/book_slice.py --openings "$openings" \
            --pairs "$PAIRS" --shards "$RUNGS" --shard "$INDEX" --seed "$SEED" \
            2> slice.txt) || { echo "::error::$(cat slice.txt)"; exit 1; }
          while read -r remark; do
            echo "::warning::${remark}"
          done < slice.txt
          echo "BOOK_FILE=${book_file}" >> "$GITHUB_ENV"
          echo "BOOK_FORMAT=${book_format}" >> "$GITHUB_ENV"
          echo "OPENINGS=${openings}" >> "$GITHUB_ENV"
          echo "START=${start}" >> "$GITHUB_ENV"

      - name: Play the rung
        working-directory: tools
        run: |
          # only fastchess and the book are cached, but a rerun on the same
          # runner would still find the last attempt's games lying here, and
          # fastchess appends to a pgn it is given
          rm -f games.pgn result.txt config.json
          # The table size is given to both sides at once rather than to the
          # opponent alone, so one line says what the match was played on.
          # fastchess will not send a size an engine declares itself unable to
          # take, so such an opponent plays on its own default and the warning
          # saying so is in the result block.
          #
          # The pgn carries everything fastchess can record about a move, so a
          # game that went wrong can be read for what the search was seeing at
          # the time. tbhits is left off; there are no tablebases here.
          #
          # INT is the signal fastchess takes as a request to stop, report the
          # games played so far and exit, and 124 is how timeout says it had
          # to send it. A rung stopped that way is a rung with fewer games in
          # the fit, and the estimate says so rather than losing the run
          status=0
          timeout -k 60 -s INT "${MAX_MATCH_MINUTES}m" ./fastchess \
            -engine "name=${ENGINE_NAME}" "cmd=./${ENGINE_NAME}" \
            -engine "name=${OPPONENT}" "cmd=./${OPPONENT}" \
            -each proto=uci "tc=$TIME_CONTROL" "option.Hash=$HASH" \
            -startup-ms "$STARTUP_MS" \
            -openings "file=$BOOK_FILE" "format=$BOOK_FORMAT" order=sequential "start=$START" \
            -rounds "$PAIRS" -repeat -concurrency "$CONCURRENCY" -recover \
            -pgnout file=games.pgn nodes=true seldepth=true nps=true \
              hashfull=true timeleft=true latency=true pv=true \
            | tee result.txt || status=$?
          if [ "$status" = "124" ]; then
            echo "STOPPED_BY=the ${MAX_MATCH_MINUTES} minute wall clock cap" >> "$GITHUB_ENV"
            echo "::warning::${OPPONENT} hit the ${MAX_MATCH_MINUTES} minute cap before its game count"
          elif [ "$status" != "0" ]; then
            exit "$status"
          else
            echo "STOPPED_BY=fastchess, at the game count" >> "$GITHUB_ENV"
          fi

      # What it would take to play this rung again, and what it was played on.
      # Written whether or not it finished, since a rung that ended badly is
      # the one that gets looked into.
      - name: Write the manifest
        if: always()
        env:
          FASTCHESS: ${{ steps.tools.outputs.fastchess }}
        run: |
          # asked for again rather than read from the step that worked out the
          # slice, since this is written whether or not that step ran
          book_file=$(scripts/book.sh file "$BOOK") || book_file=unknown
          book_sha=$(sha256sum "tools/${book_file}" | cut -d' ' -f1) || book_sha=unknown
          toolchain=$(rustc -V) || toolchain=unknown
          repository=$(scripts/opponent.sh repository "$ENGINE") || repository=unknown
          {
            echo "candidate: ${CANDIDATE:-${GITHUB_REF_NAME}}"
            echo "candidate_sha: ${CANDIDATE_SHA}"
            echo "opponent: ${OPPONENT}"
            echo "opponent_repository: ${repository}"
            echo "opponent_pin: ${TAG}"
            echo "opponent_rating: ${RATING} on the ccrl blitz list"
            echo "build: scripts/build_at.sh for ${ENGINE_NAME}, scripts/opponent.sh for ${ENGINE}"
            echo "fastchess: ${FASTCHESS}"
            echo "book: ${book_file}"
            echo "book_sha256: ${book_sha}"
            echo "book_openings: ${OPENINGS:-not counted, the rung did not get that far}"
            echo "seed: ${SEED}"
            echo "rung: ${INDEX} of ${RUNGS}"
            echo "start: ${START:-not chosen, the rung did not get that far}"
            echo "pairs: ${PAIRS}"
            echo "games_asked: $((PAIRS * 2))"
            echo "time_control: ${TIME_CONTROL}"
            # what both sides were asked for. An engine that declares a
            # smaller maximum is not sent this and plays on its own default,
            # which is why the name says asked rather than given
            echo "hash_mb_asked: ${HASH}"
            echo "concurrency: ${CONCURRENCY}"
            echo "startup_ms: ${STARTUP_MS}"
            echo "wall_clock_cap_minutes: ${MAX_MATCH_MINUTES}"
            # unset when the play step never got to the end, which is worth
            # saying rather than leaving the games to look as if they ran out
            echo "stopped_by: ${STOPPED_BY:-not recorded, the rung did not finish}"
            echo "runner: $(uname -a)"
            echo "cores: $(nproc)"
            echo "rustc: ${toolchain}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > tools/manifest.txt
          cat tools/manifest.txt

      # The games are the only record of what actually happened, and the
      # estimate reads them back out of here rather than from a workspace it
      # does not share. The attempt is in the name because an artifact cannot
      # be uploaded twice under one name, so a rerun of the run keeps its
      # earlier attempt rather than failing on the upload.
      - name: Keep the games
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibrate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
          path: |
            tools/games.pgn
            tools/result.txt
            tools/config.json
            tools/manifest.txt
          if-no-files-found: warn
          # Ninety days, which is the maximum a public repository allows and
          # was already the default in force. Written down because it is the
          # corpus's shelf life and not a detail: a games artifact that expires
          # takes an arm's games with it and they cannot be played again. An
          # implicit default can be lowered for the repository by someone who
          # is thinking about disk and not about the tuner.
          retention-days: 90

  estimate:
    needs: [resolve, play]
    # a rung that timed out or failed leaves the others worth fitting, so this
    # runs on whatever arrived rather than only on a clean sweep. The fit says
    # which rungs played no games
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      line: ${{ steps.estimate.outputs.line }}
    env:
      TIME_CONTROL: ${{ inputs.time_control }}
      LADDER_SPEC: ${{ needs.resolve.outputs.spec }}
      RUNGS: ${{ needs.resolve.outputs.count }}
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # one directory per artifact under rungs/, unless only one of them
      # arrived, which is extracted straight into rungs/; the find below takes
      # it either way. The attempt is in the pattern so that a rerun fits its
      # own games rather than counting an earlier attempt's as well
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: calibrate-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: rungs

      - name: Work out the rating
        id: estimate
        run: |
          mapfile -t games < <(find rungs -name games.pgn 2>/dev/null | sort)
          if [ "${#games[@]}" -eq 0 ]; then
            echo "::error::no rung of attempt ${GITHUB_RUN_ATTEMPT} uploaded any games. Rerunning the failed jobs alone leaves the games on the attempt that played them, so rerun all of them."
            exit 1
          fi
          # one gauntlet again, since the rungs played disjoint openings and
          # the fit reads a game at a time
          cat "${games[@]}" > gauntlet.pgn
          # how the games ended, counted from the games themselves rather than
          # guessed at from the words in a result block. A rung that lost games
          # to a crash or the clock still counts in the fit, because choosing
          # what to count after seeing it is not a measurement; the counts sit
          # beside the estimate instead
          if python3 scripts/match_terminations.py gauntlet.pgn \
              > terminations.txt 2> faults.txt; then
            while read -r remark; do
              echo "::warning::${remark}"
            done < faults.txt
          else
            echo "::warning::The games could not be counted, the block below is incomplete"
            cat faults.txt
          fi
          # anything the estimate wants to say about itself, a rung that played
          # no games or a fit the pairings disagree with, goes to stderr, so it
          # is picked up from there rather than parsed back out of the table
          python3 scripts/rating_estimate.py \
            gauntlet.pgn "$ENGINE_NAME" "$LADDER_SPEC" > table.md 2> notes.txt \
            || { cat notes.txt >&2; exit 1; }
          # asked for again rather than cut out of the table, so that a change
          # to how the table is laid out cannot quietly change what is published
          # to the log as well as to the summary, for the reason the strength
          # workflow says at the same place
          cat table.md
          line=$(python3 scripts/rating_estimate.py \
            gauntlet.pgn "$ENGINE_NAME" "$LADDER_SPEC" --line 2> /dev/null)
          echo "line=Estimated rating | ${line}" >> "$GITHUB_OUTPUT"
          echo "::notice::${line}"
          while read -r remark; do
            echo "::warning::${remark}"
          done < notes.txt
          {
            echo "### Rating estimate"
            echo
            echo "\`${CANDIDATE_SHA:0:8}\` at ${TIME_CONTROL} against engines with a"
            echo "rating on the [ccrl](https://computerchess.org.uk/) blitz list,"
            echo "${#games[@]} of ${RUNGS} rungs played."
            echo
            cat table.md
            # one alert with every remark inside it, rather than one alert each,
            # which renders as the first alert with the rest of the markup
            # showing through as text
            if [ -s notes.txt ]; then
              echo
              echo "> [!WARNING]"
              sed 's/^/> /' notes.txt
            fi
            echo
            echo "How the games ended:"
            echo
            echo '```'
            cat terminations.txt
            echo '```'
            echo
            echo "The games of each rung are kept as the"
            echo "\`calibrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-<engine>-<pin>\` artifacts, with a manifest"
            echo "saying what was played on what. The openings came from seed ${SEED},"
            echo "which replays this schedule."
            echo
            echo "The opponents were rated at 2m+1s on other hardware, so the"
            echo "placement carries a systematic error the game count does not"
            echo "describe. It is worth about a hundred points, and no number of"
            echo "games reduces it."
          } >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    needs: estimate
    if: inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
    with:
      marker: ${{ inputs.marker || 'arche:rating' }}
      line: ${{ needs.estimate.outputs.line }}
