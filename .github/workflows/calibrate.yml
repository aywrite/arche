name: Calibrate

# Estimates what the engine would be rated on a ccrl list by playing it
# against engines that already have a rating there. The ratings were earned on
# other hardware at a slower time control, so this is a rough placement rather
# than a rating.
#
# A rung is an engine scripts/opponent.sh can build, pinned at the released
# version the list rates. scripts/ladders.sh holds each list's ladder, time
# control, games and wall clock cap. A box left empty takes the list's value,
# so choosing a list cannot leave another list's ladder in place.
#
# Each rung is a job playing its own slice of the book, and the estimate job
# fits one rating to all of them. Every rung keeps its games, its result
# block, the fastchess config and a manifest as
# <prefix>-<run id>-<attempt>-<engine>-<pin>, so a corrected ladder can be
# refitted without playing again. The prefix is the list's, so the release's
# two gauntlets neither collide nor pool each other's games.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: What to measure. A branch, tag, commit or pull request number. Defaults to the ref this is run against.
        type: string
      list:
        description: The ccrl list to place the engine on. The boxes below left empty take its values from scripts/ladders.sh.
        type: choice
        options:
          - blitz
          - 40/15
        default: blitz
      ladder:
        description: Opponents to play, as engine, pin and a rating on the list above (goldfish:v2.1.1:2252,stash:v17.0:2297). Empty plays the list's own ladder.
        type: string
      time_control:
        description: Passed to fastchess as tc. Empty plays the list's own.
        type: string
      games:
        description: Games against each opponent, rounded down to an even number. Empty plays the list's own number.
        type: string
      book:
        description: The opening set the run plays, one of the books in scripts/book.sh. Figures on different books are not comparable.
        type: string
        default: 8moves_v3
      seed:
        description: Seed for the region of the book the rungs play, an unsigned integer. Left empty it is the run id, and either way the manifests record it.
        type: string
  workflow_call:
    inputs:
      candidate:
        type: string
        required: false
      list:
        type: string
        default: blitz
      # no defaults: these three and max_match_minutes take the list's values
      ladder:
        type: string
      time_control:
        type: string
      games:
        type: number
      book:
        type: string
        default: 8moves_v3
      seed:
        type: string
      publish:
        description: Append the result to the release notes for this tag
        type: boolean
        default: false
      engine_name:
        description: The name the engine being measured plays under
        type: string
        default: arche
      # what the rungs are played on rather than what they play, so not boxes
      # on the actions tab
      hash_mb:
        description: The table both sides are given, in MB
        type: number
        default: 256
      concurrency:
        description: Games a rung plays at once
        type: number
        default: 2
      max_match_minutes:
        description: The wall clock cap on play alone
        type: number
      startup_ms:
        description: How long fastchess waits for an engine to answer uci
        type: number
        default: 20000
      marker:
        description: Identifies this workflow's line in the release notes
        type: string
        default: arche:rating

permissions:
  contents: read

env:
  # A workflow_call default is not applied to a run started from the actions
  # tab, so every call default is repeated in the expression that reads it.
  #
  # The estimate reads the games for a player of this name, so the binary, the
  # pgn and the estimate all use this one value. ENGINE in the play job is the
  # opponent's.
  ENGINE_NAME: ${{ inputs.engine_name || 'arche' }}
  # 256MB is what ccrl rates an engine with and what this one defaults to. An
  # engine that declares a smaller maximum plays on its own default, which its
  # result block records.
  HASH: ${{ inputs.hash_mb || 256 }}
  CONCURRENCY: ${{ inputs.concurrency || 2 }}
  # the engine allocates its table before it answers uci, which can take
  # longer than fastchess's ten second default
  STARTUP_MS: ${{ inputs.startup_ms || 20000 }}
  LIST: ${{ inputs.list || 'blitz' }}

jobs:
  # The candidate ref becomes a commit once, so every rung measures the same
  # build.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      rungs: ${{ steps.plan.outputs.rungs }}
      count: ${{ steps.plan.outputs.count }}
      pairs: ${{ steps.plan.outputs.pairs }}
      spec: ${{ steps.plan.outputs.spec }}
      book: ${{ steps.plan.outputs.book }}
      play_timeout: ${{ steps.plan.outputs.play_timeout }}
      time_control: ${{ steps.preset.outputs.time_control }}
      max_match_minutes: ${{ steps.preset.outputs.max_match_minutes }}
      rated_at: ${{ steps.preset.outputs.rated_at }}
      artifact: ${{ steps.preset.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # What the list rates at and the artifact prefix are not boxes. A list
      # ladders.sh does not name is refused here.
      - name: Read the list's settings
        id: preset
        env:
          LADDER: ${{ inputs.ladder }}
          TIME_CONTROL: ${{ inputs.time_control }}
          # a number not given may arrive as 0 rather than empty
          GAMES: ${{ inputs.games || '' }}
          MAX_MATCH_MINUTES: ${{ inputs.max_match_minutes || '' }}
        run: |
          declare -A given=(
            [ladder]=$LADDER
            [time_control]=$TIME_CONTROL
            [games]=$GAMES
            [max_match_minutes]=$MAX_MATCH_MINUTES
          )
          scripts/ladders.sh preset "$LIST" > preset.txt \
            || { echo "::error::$(scripts/ladders.sh preset "$LIST" 2>&1)"; exit 1; }
          while IFS='=' read -r key value; do
            echo "${key}=${given[$key]:-$value}"
          done < preset.txt | tee -a "$GITHUB_OUTPUT"

      - uses: aywrite/mache/actions/resolve-ref@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: candidate
        with:
          ref: ${{ inputs.candidate }}
          label: candidate
          # nothing named means the commit this was dispatched on
          when_empty: head

      - uses: aywrite/mache/actions/plan-ladder@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: plan
        with:
          games: ${{ steps.preset.outputs.games }}
          ladder: ${{ steps.preset.outputs.ladder }}
          book: ${{ inputs.book }}
          max_match_minutes: ${{ steps.preset.outputs.max_match_minutes }}

  play:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rung: ${{ fromJSON(needs.resolve.outputs.rungs) }}
    # without a name a matrix job is named for every value in its entry
    name: play ${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
    defaults:
      run:
        shell: bash
    env:
      ENGINE: ${{ matrix.rung.engine }}
      TAG: ${{ matrix.rung.tag }}
      # the engine is in the name because two engines can share a version
      # string
      OPPONENT: ${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
      RATING: ${{ matrix.rung.rating }}
      INDEX: ${{ matrix.rung.index }}
      RUNGS: ${{ needs.resolve.outputs.count }}
      PAIRS: ${{ needs.resolve.outputs.pairs }}
      TIME_CONTROL: ${{ needs.resolve.outputs.time_control }}
      MAX_MATCH_MINUTES: ${{ needs.resolve.outputs.max_match_minutes }}
      ARTIFACT: ${{ needs.resolve.outputs.artifact }}
      BOOK: ${{ needs.resolve.outputs.book }}
      # the region of the book, not a shuffle. A seed given by hand replays a
      # run
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE: ${{ inputs.candidate }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aywrite/mache/actions/setup@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: tools

      # the cache keeps the dependencies; the engine is built from an export
      # of its commit
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the engine
        run: |
          # a pull request head is not fetched by default, and the resolve
          # job's fetch was on another machine
          git cat-file -e "${CANDIDATE_SHA}^{commit}" 2>/dev/null \
            || git fetch -q origin "$CANDIDATE_SHA" \
            || git fetch -q origin "+refs/pull/*/head:refs/remotes/pull/*"
          scripts/build_at.sh "$CANDIDATE_SHA" "tools/${ENGINE_NAME}"

      # Not cached: the opponents compile in a second to half a minute, less
      # than fetching a cache costs.
      - name: Build the opponent
        run: |
          scripts/opponent.sh build "$ENGINE" "$TAG" "tools/${OPPONENT}" \
            || { echo "::error::cannot build ${OPPONENT}"; exit 1; }
          ls -l "tools/${OPPONENT}"

      - uses: aywrite/mache/actions/play-shard@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: play
        with:
          candidate: ${{ env.ENGINE_NAME }}
          candidate_binary: ./${{ env.ENGINE_NAME }}
          opponent: ${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
          opponent_binary: ./${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
          book: ${{ needs.resolve.outputs.book }}
          pairs: ${{ needs.resolve.outputs.pairs }}
          # a rung takes its slice of the book the way a shard does: the
          # rungs are the shards of one pass over it
          shards: ${{ needs.resolve.outputs.count }}
          shard: ${{ matrix.rung.index }}
          seed: ${{ inputs.seed || github.run_id }}
          time_control: ${{ env.TIME_CONTROL }}
          hash_mb: ${{ env.HASH }}
          concurrency: ${{ env.CONCURRENCY }}
          startup_ms: ${{ env.STARTUP_MS }}
          max_match_minutes: ${{ env.MAX_MATCH_MINUTES }}

      # What it would take to play this rung again, written whether or not it
      # finished.
      - name: Write the manifest
        if: always()
        env:
          FASTCHESS: ${{ steps.tools.outputs.fastchess }}
          MACHE: ${{ steps.tools.outputs.version }}
          OPENINGS: ${{ steps.play.outputs.openings }}
          START: ${{ steps.play.outputs.start }}
          STOPPED_BY: ${{ steps.play.outputs.stopped_by }}
        run: |
          # asked for again, since the play action may not have got that far
          book_file=$(scripts/book.sh file "$BOOK") || book_file=unknown
          book_sha=$(sha256sum "tools/${book_file}" | cut -d' ' -f1) || book_sha=unknown
          toolchain=$(rustc -V) || toolchain=unknown
          repository=$(scripts/opponent.sh repository "$ENGINE") || repository=unknown
          {
            echo "candidate: ${CANDIDATE:-${GITHUB_REF_NAME}}"
            echo "candidate_sha: ${CANDIDATE_SHA}"
            echo "opponent: ${OPPONENT}"
            echo "opponent_repository: ${repository}"
            echo "opponent_pin: ${TAG}"
            echo "opponent_rating: ${RATING} on the ccrl ${LIST} list"
            echo "build: scripts/build_at.sh for ${ENGINE_NAME}, scripts/opponent.sh for ${ENGINE}"
            echo "fastchess: ${FASTCHESS}"
            echo "mache: ${MACHE}"
            echo "book: ${book_file}"
            echo "book_sha256: ${book_sha}"
            echo "book_openings: ${OPENINGS:-not counted, the rung did not get that far}"
            echo "seed: ${SEED}"
            echo "rung: ${INDEX} of ${RUNGS}"
            echo "start: ${START:-not chosen, the rung did not get that far}"
            echo "pairs: ${PAIRS}"
            echo "games_asked: $((PAIRS * 2))"
            echo "time_control: ${TIME_CONTROL}"
            echo "hash_mb_asked: ${HASH}"
            echo "concurrency: ${CONCURRENCY}"
            echo "startup_ms: ${STARTUP_MS}"
            echo "wall_clock_cap_minutes: ${MAX_MATCH_MINUTES}"
            echo "stopped_by: ${STOPPED_BY:-not recorded, the rung did not finish}"
            echo "runner: $(uname -a)"
            echo "cores: $(nproc)"
            echo "rustc: ${toolchain}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > tools/manifest.txt
          cat tools/manifest.txt

      # The attempt is in the name because a rerun keeps the run id and an
      # artifact name cannot be uploaded twice.
      - name: Keep the games
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rung.engine }}-${{ matrix.rung.tag }}
          path: |
            tools/games.pgn
            tools/result.txt
            tools/config.json
            tools/manifest.txt
          if-no-files-found: warn
          # the most a public repository allows, written out because the
          # repository default can be lowered
          retention-days: 90

  estimate:
    needs: [resolve, play]
    # runs on whatever arrived; the fit says which rungs played no games
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TIME_CONTROL: ${{ needs.resolve.outputs.time_control }}
      RATED_AT: ${{ needs.resolve.outputs.rated_at }}
      ARTIFACT: ${{ needs.resolve.outputs.artifact }}
    outputs:
      line: ${{ steps.line.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aywrite/mache/actions/setup@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        with:
          estimator_only: true

      # One directory per artifact under rungs/, except that a single artifact
      # is extracted straight into rungs/; the action takes either. The
      # attempt is in the pattern so a rerun does not count an earlier
      # attempt's games as well. The prefix is followed by the run id, so a
      # blitz run's pattern cannot match a 40/15 run's artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.ARTIFACT }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: rungs

      - uses: aywrite/mache/actions/summarise-gauntlet@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: estimate
        with:
          games: rungs
          engine_name: ${{ env.ENGINE_NAME }}
          candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
          ladder_spec: ${{ needs.resolve.outputs.spec }}
          rungs: ${{ needs.resolve.outputs.count }}
          time_control: ${{ env.TIME_CONTROL }}
          rating_list: "[ccrl](https://computerchess.org.uk/) ${{ env.LIST }}"
          rating_time_control: ${{ env.RATED_AT }}
          provenance: >-
            The games of each rung are kept as the
            `${{ env.ARTIFACT }}-${{ github.run_id }}-${{ github.run_attempt }}-<engine>-<pin>`
            artifacts, with a manifest saying what was played on what. The
            openings came from seed ${{ inputs.seed || github.run_id }}, which
            replays this schedule.

      # mache writes the blitz scale into the line whatever the list. A
      # line that no longer says so is refused rather than published under the
      # wrong list
      - name: Name the list in the line
        id: line
        env:
          LINE: ${{ steps.estimate.outputs.line }}
        run: |
          if [ "$LIST" != blitz ]; then
            case "$LINE" in
              *"ccrl blitz scale"*) ;;
              *) echo "::error::the line does not name the blitz scale to replace: ${LINE}"; exit 1 ;;
            esac
            LINE=${LINE/ccrl blitz scale/ccrl ${LIST} scale}
          fi
          echo "line=${LINE}" >> "$GITHUB_OUTPUT"

  release-notes:
    needs: estimate
    if: inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
    with:
      marker: ${{ inputs.marker || 'arche:rating' }}
      line: ${{ needs.estimate.outputs.line }}
