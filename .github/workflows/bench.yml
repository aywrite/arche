name: Bench

# Checks on what commits say about themselves, and one measurement of what
# they do.
#
# The pins job reads each commit's stated bench against the counts its own
# tree pins. It is cheap, so it runs on a push to master as well: a commit
# rebased before it lands is not the commit the bench job built, and its
# message can be stale by the time it arrives.
#
# The trailers job runs the pre-commit hooks over the tree and the commit-msg
# hooks over every commit, so a bad scope or a missing bench fails here rather
# than slipping past a clone that never installed the hooks.
#
# The bench job builds each commit that states a bench and counts it. The
# count is exact and the same on any machine, so it gates. Pull requests only:
# on master the Rust workflow's tests prove the pins and the pins job holds
# the messages to them.
#
# The speed job measures the pull request against the commit it would land
# on, the way scripts/speed.sh measures a perf commit, and reports without
# gating: a runner's rate is context, not a claim. It counts the instructions
# each side executes as well, which repeat exactly enough to show a change
# the rate cannot, and says nothing about what the hardware does with them.

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a push to master is not cancelled: the commits it checks are already on
  # master and nothing else will look at them
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit's stated bench against its pins
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            # a first push has no before, so fall back to the one parent
            base="${{ github.event.before }}"
            case "$base" in
              ''|0000000000000000000000000000000000000000) base=$(git rev-parse HEAD^) ;;
            esac
            head="${{ github.sha }}"
          else
            base=$(git rev-parse HEAD^1)
            head=$(git rev-parse HEAD^2)
          fi
          scripts/check_bench_pins.py "$base" "$head"

  trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python3 -m pip install --quiet pre-commit
      - name: Run the hooks over the tree
        # the Rust workflow gates fmt and cargo check on three platforms
        env:
          SKIP: fmt,cargo-check
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run the commit-msg hooks over every commit
        # reported even when the tree failed, so both are heard of at once
        if: success() || failure()
        shell: bash
        run: |
          # the checkout is a merge of the pull request into its base: the
          # first parent is the base and the second is the pull request's head
          failed=0
          for sha in $(git rev-list --reverse "$(git rev-parse HEAD^1)..$(git rev-parse HEAD^2)"); do
            git log -1 --format=%B "$sha" > commit-msg.txt
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            if ! pre-commit run --hook-stage commit-msg --commit-msg-filename commit-msg.txt; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Count the bench of every commit that states one
        shell: bash
        run: scripts/verify_bench.sh "$(git rev-parse HEAD^1)" "$(git rev-parse HEAD^2)"

  speed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build both sides
        shell: bash
        run: |
          # the checkout is a merge of the pull request into its base: the
          # first parent is the base and the merge is what would land
          echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          scripts/build_at.sh HEAD^1 base-arche
          scripts/build_at.sh HEAD pr-arche
      - name: Measure
        id: measure
        shell: bash
        run: |
          # twenty five rounds rather than the local fifteen: a round of two
          # runs is under four seconds here, and the interval narrows with
          # the root of the count
          python3 scripts/speed.py ./base-arche ./pr-arche \
            --base-ref "${BASE_SHA:0:8}" --rounds 25 | tee speed.txt
      - name: Count instructions
        id: count
        # after the timing rather than beside it, so cachegrind never shares
        # the runner with a timed run. It reports and does not gate, and a
        # hang ends the step rather than the job, so the comment still posts
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          # the image's package lists go stale between image updates
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends valgrind > /dev/null
          python3 scripts/instructions.py ./base-arche ./pr-arche \
            --base-ref "${BASE_SHA:0:8}" | tee instructions.txt
      - name: Summarise
        # a failed measurement is reported as one, not as whatever tee wrote
        if: ${{ !cancelled() }}
        env:
          MEASURED: ${{ steps.measure.outcome }}
          COUNTED: ${{ steps.count.outcome }}
        shell: bash
        run: |
          {
            # marks the comment as this job's, so the next run replaces it
            echo "<!-- speed-summary -->"
            echo "## Speed against \`${BASE_SHA:0:8}\`"
            echo
            echo "Both sides built and run on this runner in this job, the way"
            echo "\`scripts/speed.sh\` measures a perf commit. The change is read"
            echo "from each round's pair, with a 95% interval, and the verdict"
            echo "holds that interval against a 2% threshold, set above the 1.5%"
            echo "that moving the code about has moved the rate on its own. The"
            echo "node counts are the search's: they move when the search does,"
            echo "and a speed change leaves them alone."
            echo
            echo '```'
            if [ "$MEASURED" = success ]; then
              cat speed.txt
            else
              echo "the measurement failed, see the job's log"
            fi
            echo '```'
            echo
            echo "The instructions each side's bench executed, counted under"
            echo "cachegrind. The count repeats to within a few hundred"
            echo "instructions, so a small change here is a real one, but it"
            echo "prices instructions only: cache misses, mispredicted branches"
            echo "and where the code lands are the speed's to show."
            echo
            echo '```'
            if [ "$COUNTED" = success ]; then
              cat instructions.txt
            else
              echo "the count failed, see the job's log"
            fi
            echo '```'
          } > speed-summary.md
          cat speed-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Put where the change is being read. The api rather than an action, so
      # there is one less thing to keep off a deprecated node.
      - name: Post the summary to the pull request
        # a fork's pull request gets a read only token, so there is nothing
        # to post with
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          jq -n --rawfile body speed-summary.md '{body: $body}' > comment.json
          # edit the comment the last run left rather than adding one per push
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.body | startswith("<!-- speed-summary -->")) | .id' \
            | tail -1)
          if [ -n "$existing" ]; then
            gh api --silent --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input comment.json
          else
            gh api --silent --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --input comment.json
          fi
