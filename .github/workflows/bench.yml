name: Bench

# Checks on what commits say about themselves, and one measurement of what
# they do.
#
# The pins job is the only one that runs on a push to master as well, because
# it is the only one cheap enough to. A commit rebased before it lands is not
# the commit the jobs below built, so a message they passed can be stale by
# the time it arrives: the bench a tree counts is the sum of the counts it
# pins, and that is read rather than built.
#
# The trailers job runs the pre-commit hooks over the tree and the commit-msg
# hooks over every commit, so a scope the changelog does not know, or an
# engine commit with no bench stated, fails here rather than slipping past a
# clone that never installed the hooks.
#
# The bench job builds each commit that states a bench and counts it. The
# count is exact and the same on any machine, so this one gates: a commit
# whose stated bench is not the bench is wrong, and a history whose numbers
# cannot be trusted is worse than one with none. It runs on pull requests
# alone, where building each commit is the price of proving the pins; on
# master the Rust workflow's tests prove those, and the pins job holds the
# messages to them.
#
# The speed job measures the pull request against the commit it would land
# on, both built and run on one runner in one job, the way scripts/speed.sh
# measures a perf commit: the bench of each side in turn, the side that goes
# first alternating, and the change between medians printed with the spread
# it has to be read against. It reports and does not gate. A runner's rate is
# context, not a claim; the count is the claim, and it has the job above.

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a superseded pull request run is worth cancelling; a push to master is
  # not, since the commits it would have checked are already on master and
  # nothing else will look at them
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  pins:
    # What a landed commit says about itself, checked against what its own
    # tree pins. The job below builds a pull request's commits, but a commit
    # rebased before it lands is not the commit that was built: if the base
    # changed what the bench counts, a message that passed is stale by the
    # time it arrives, and nothing looked again. This is cheap enough to look
    # again, on the commits as they actually landed.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit's stated bench against its pins
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            # a first push has no before, so fall back to the one parent
            base="${{ github.event.before }}"
            case "$base" in
              ''|0000000000000000000000000000000000000000) base=$(git rev-parse HEAD^) ;;
            esac
            head="${{ github.sha }}"
          else
            base=$(git rev-parse HEAD^1)
            head=$(git rev-parse HEAD^2)
          fi
          scripts/check_bench_pins.py "$base" "$head"

  trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python3 -m pip install --quiet pre-commit
      - name: Run the hooks over the tree
        # fmt and cargo check are what the Rust workflow gates, on three
        # platforms; run here as well they would only build the tree again
        env:
          SKIP: fmt,cargo-check
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run the commit-msg hooks over every commit
        # reported even when the tree failed, so a pull request with both
        # kinds of problem hears of both at once
        if: success() || failure()
        shell: bash
        run: |
          # the checkout is a merge of the pull request into its base: the
          # first parent is the base and the second is the pull request's head
          failed=0
          for sha in $(git rev-list --reverse "$(git rev-parse HEAD^1)..$(git rev-parse HEAD^2)"); do
            git log -1 --format=%B "$sha" > commit-msg.txt
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            if ! pre-commit run --hook-stage commit-msg --commit-msg-filename commit-msg.txt; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Count the bench of every commit that states one
        shell: bash
        run: scripts/verify_bench.sh "$(git rev-parse HEAD^1)" "$(git rev-parse HEAD^2)"

  speed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # both sides get built, so both need their history
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build both sides
        shell: bash
        run: |
          # the checkout is a merge of the pull request into its base: the
          # first parent is the base and the merge is what would land
          echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          scripts/build_at.sh HEAD^1 base-arche
          scripts/build_at.sh HEAD pr-arche
      - name: Measure
        id: measure
        shell: bash
        run: |
          # nine rounds rather than the local five: a shared runner's rounds
          # range further than a quiet box's, and the extra half minute buys
          # medians a single loaded round cannot drag
          python3 scripts/speed.py ./base-arche ./pr-arche \
            --base-ref "${BASE_SHA:0:8}" --rounds 9 | tee speed.txt
      - name: Summarise
        # a failed measurement is reported as one, not as whatever tee had
        # written by the time speed.py gave up
        if: ${{ !cancelled() }}
        env:
          MEASURED: ${{ steps.measure.outcome }}
        shell: bash
        run: |
          {
            # marks the comment as this job's, so the next run replaces it
            echo "<!-- speed-summary -->"
            echo "## Speed against \`${BASE_SHA:0:8}\`"
            echo
            echo "Both sides built and run on this runner in this job, the way"
            echo "\`scripts/speed.sh\` measures a perf commit. The change is between"
            echo "medians, and the spread beside it is what the change has to be"
            echo "read against. The node counts are the search's: they move when"
            echo "the search does, and a speed change leaves them alone."
            echo
            echo '```'
            if [ "$MEASURED" = success ]; then
              cat speed.txt
            else
              echo "the measurement failed, see the job's log"
            fi
            echo '```'
          } > speed-summary.md
          cat speed-summary.md >> "$GITHUB_STEP_SUMMARY"

      # A summary nobody opens is barely better than none, so put it where the
      # change is being read. Done with the api rather than an action so there
      # is one less thing to keep off a deprecated node.
      - name: Post the summary to the pull request
        # a fork's pull request gets a read only token, so there is nothing to
        # post with and failing the job over it would help no one
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          jq -n --rawfile body speed-summary.md '{body: $body}' > comment.json
          # edit the comment the last run left rather than adding one per push
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.body | startswith("<!-- speed-summary -->")) | .id' \
            | tail -1)
          if [ -n "$existing" ]; then
            gh api --silent --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input comment.json
          else
            gh api --silent --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --input comment.json
          fi
