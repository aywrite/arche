name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
  # run against a tag from the actions tab, either to redo a release or because
  # the prepare release workflow started it, a tag it pushed itself does not set
  # off the trigger above
  workflow_dispatch:

jobs:
  # a tag can be pushed from anywhere, so the tests are run again here rather
  # than trusting whatever ran on master
  test:
    runs-on: ubuntu-latest
    steps:
      # everything below expects to be looking at a release tag, which is not
      # true if this was started by hand against a branch
      - name: Check this is a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "::error::this has to run against a release tag, got ${{ github.ref }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace --locked --release

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          # (optional) Path to changelog.
          changelog: CHANGELOG.md
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # The x86-64 platforms get three builds: the baseline the tag always
        # shipped, and the v2 and v3 microarchitecture levels, which is where
        # popcnt and then avx2/bmi2 live. The evaluation counts pieces with
        # count_ones and the generator pops bits with trailing_zeros, so the
        # baseline build spells both out by hand. The node counts cannot move
        # -- the flags change instructions, not the search -- which is what
        # lets a variant be checked by running it. The mac runner is arm and
        # needs no variants.
        cpu: ["", x86-64-v2, x86-64-v3]
        exclude:
          - os: macos-latest
            cpu: x86-64-v2
          - os: macos-latest
            cpu: x86-64-v3
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.cpu && format('-C target-cpu={0}', matrix.cpu) || '' }}
      # the plain build keeps the name every past release used; a variant
      # says which level it needs, so nobody runs one on a cpu it will not
      # start on without having chosen to
      VARIANT: ${{ matrix.cpu == 'x86-64-v2' && '-v2' || matrix.cpu == 'x86-64-v3' && '-v3' || '' }}
    # contents: write is the workflow's, restated because a job that declares
    # permissions gets these and no others. The other two are the attestation's:
    # the job asks github for a short lived signing certificate with its own
    # oidc token, and files the result against this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the variant is proven to run before it is shipped: the runner is
      # newer than any level built here, so a build that would trap on its
      # own instructions fails this step rather than a downloader's evening
      - name: Run what is about to be shipped
        run: cargo run --release --locked -- bench 2
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        id: upload
        with:
          bin: "arche"
          tar: unix
          zip: windows
          checksum: "sha256"
          archive: $bin-$tag-$target${{ env.VARIANT }}
          # The readme links to the changelog and to docs/, so they travel
          # with it; a relative link in the archive is dead otherwise.
          include: LICENSE,README.md,CHANGELOG.md,docs
          # (required) GitHub token for uploading assets to GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

      # The checksum above says a download arrived intact and nothing about
      # where it came from, and it is published on the same page as the file it
      # describes, so anyone who could replace one could replace both. The
      # attestation is the other half: a signed statement that these bytes came
      # out of this workflow, at this commit, which `gh attestation verify`
      # checks with github rather than with the release page. How to run it is
      # in the readme.
      #
      # The subject is the checksum file rather than the archives, because the
      # action names that file in its sha256 output and it already lists every
      # archive this runner built with its digest. A path would have had to know
      # which of the two the platform produced, since the tar is built on unix
      # and the zip on windows.
      - name: Attest what was built
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-checksums: ${{ steps.upload.outputs.sha256 }}

  # Builds and publishes the lichess-bot image for the tag. It runs from here
  # rather than from its own tag trigger so that it waits for the tests and for
  # the release it writes to.
  docker:
    needs: create-release
    # A called workflow cannot hold more than the job that calls it was given,
    # so the two the image's attestation needs are granted here as well as
    # declared there. Without them the build job asks for a signing certificate
    # it is not allowed to have.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      release: true

  # Plays a short match against the previous release and adds the result to the
  # release notes. Fifty games is only enough to detect a large change, the
  # error margin is published alongside the estimate so it can be read honestly.
  strength:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/strength.yml
    with:
      games: 50
      publish: true

  # Places the release on the ccrl scale by playing rated opponents, which says
  # something the match against the previous release cannot: that one says which
  # of the two is better, this one says roughly where both of them sit.
  #
  # After strength rather than alongside it, which costs an hour of release wall
  # clock and buys two things: the two of them do not race to build and save the
  # same fastchess cache from cold, and only two jobs are ever queued to edit
  # the release notes, which is the most that queue holds without dropping one.
  #
  # The condition is what makes that sequencing rather than dependency. Needing
  # a job means needing it to have succeeded, and this needs nothing strength
  # produces, so without the condition a strength match that failed or that had
  # no previous release to measure against would take the rating estimate down
  # with it. Cancelled is excluded so that calling off a release does not still
  # spend an hour of runner on it.
  calibrate:
    needs: [create-release, strength]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/calibrate.yml
    with:
      games: 26
      publish: true
