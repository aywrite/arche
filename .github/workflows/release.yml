name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
  # run against a tag from the actions tab, either to redo a release or because
  # the prepare release workflow started it, a tag it pushed itself does not set
  # off the trigger above
  workflow_dispatch:

jobs:
  # a tag can be pushed from anywhere, so the tests are run again here rather
  # than trusting whatever ran on master
  test:
    runs-on: ubuntu-latest
    steps:
      # everything below expects to be looking at a release tag, which is not
      # true if this was started by hand against a branch
      - name: Check this is a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "::error::this has to run against a release tag, got ${{ github.ref }}"
          exit 1
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked --release

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # (optional) Path to changelog.
          changelog: CHANGELOG.md
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: "arche"
          tar: unix
          zip: windows
          checksum: "sha256"
          archive: $bin-$tag-$target
          # (required) GitHub token for uploading assets to GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  # Plays a short match against the previous release and adds the result to the
  # release notes. Fifty games is only enough to detect a large change, the
  # error margin is published alongside the estimate so it can be read honestly.
  sanity-check:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      GAMES: 50
      TIME_CONTROL: 10+0.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the previous release
        id: previous
        run: |
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                | grep -v -- '-rc' \
                | grep -v -x "$GITHUB_REF_NAME" \
                | head -1)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No previous release to compare against, skipping"
          fi

      - name: Cache the match tools
        if: steps.previous.outputs.tag != ''
        id: tools
        uses: actions/cache@v4
        with:
          path: tools
          key: match-tools-fastchess-1.8.2-alpha-8moves-v3

      - name: Build the match tools
        if: steps.previous.outputs.tag != '' && steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          # every fastchess release is tagged -alpha, there is no plain v1.8.2
          git clone --depth 1 --branch v1.8.2-alpha \
            https://github.com/Disservin/fastchess.git /tmp/fastchess
          make -C /tmp/fastchess -j"$(nproc)"
          cp /tmp/fastchess/fastchess tools/
          curl -sSLf -o /tmp/book.zip \
            https://raw.githubusercontent.com/official-stockfish/books/master/8moves_v3.pgn.zip
          unzip -qo /tmp/book.zip -d tools

      - name: Build both releases
        if: steps.previous.outputs.tag != ''
        run: |
          cargo build --release
          cp target/release/arche tools/new
          git checkout --detach "${{ steps.previous.outputs.tag }}"
          cargo build --release
          cp target/release/arche tools/old
          git checkout --detach "$GITHUB_SHA"

      - name: Play the match
        if: steps.previous.outputs.tag != ''
        working-directory: tools
        run: |
          # the default startup timeout is too short for the magic bitboards to
          # be generated when several engines start at once
          ./fastchess \
            -engine "name=$GITHUB_REF_NAME" cmd=./new \
            -engine "name=${{ steps.previous.outputs.tag }}" cmd=./old \
            -each proto=uci "tc=$TIME_CONTROL" -startup-ms 60000 \
            -openings file=8moves_v3.pgn format=pgn order=random \
            -rounds "$((GAMES / 2))" -repeat 2 -concurrency 2 -recover \
            | tee result.txt

      - name: Add the result to the release notes
        if: steps.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          if grep -qiE 'disconnect|stalled|loses on time' tools/result.txt; then
            echo "::warning::An engine crashed or lost on time, the estimate is unreliable"
          fi
          summary=$(python3 - <<'PY'
          import re
          text = open("tools/result.txt").read()
          # the lookbehind keeps this from matching the nElo figure on the same line
          elo, margin = re.findall(r"(?<![A-Za-z])Elo:\s*(-?[\d.]+)\s*\+/-\s*([\d.]+)", text)[-1]
          games = re.findall(r"Games:\s*(\d+)", text)[-1]
          print(f"{round(float(elo)):+d} ±{round(float(margin))} Elo ({games} games)")
          PY
          )
          line="Sanity Check: performance compared to $PREVIOUS | $summary"
          echo "::notice::$line"
          gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.md
          printf '\n%s\n' "$line" >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
