name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
  # from the actions tab, to redo a release or because tag-release.yml started
  # it: a tag pushed with GITHUB_TOKEN does not set off the trigger above
  workflow_dispatch:

jobs:
  # a tag can be pushed from anywhere, so the tests run again here
  test:
    runs-on: ubuntu-latest
    steps:
      # a run started by hand against a branch would otherwise get this far
      - name: Check this is a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "::error::this has to run against a release tag, got ${{ github.ref }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the bench pin check walks every commit since the last release
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace --locked --release
      # The changelog publishes each commit's stated bench, so the stated
      # benches are read against the pins over the range the changelog covers.
      # Lapses already on master are in scripts/acknowledged_bench_pins.txt
      # and are reported rather than failed on.
      - name: Check the stated benches against the pins
        run: |
          # the last full release, found the way scripts/changelog.sh finds
          # it. The tag being released is skipped: changelog.sh ran before it
          # existed
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -v -- '-' | grep -v -x -- "${GITHUB_REF_NAME}" | head -1 || true)
          if [ -z "$previous" ]; then
            echo "no previous release, nothing to read this one against"
            exit 0
          fi
          echo "reading ${previous}..HEAD"
          python3 scripts/check_bench_pins.py "$previous" HEAD

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          # (optional) Path to changelog.
          changelog: CHANGELOG.md
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # Three x86-64 builds: the baseline, and the v2 and v3 levels, where
        # popcnt and then avx2/bmi2 live. Without popcnt the baseline spells
        # out count_ones and trailing_zeros by hand; v2 is 4.54% fewer
        # instructions over the bench for the same tree, measured at a889930
        # and written out in .cargo/config.toml. The flags change
        # instructions, not the search, so the node counts cannot move. The
        # mac runner is arm and needs no variants.
        cpu: ["", x86-64-v2, x86-64-v3]
        exclude:
          - os: macos-latest
            cpu: x86-64-v2
          - os: macos-latest
            cpu: x86-64-v3
    runs-on: ${{ matrix.os }}
    env:
      # the baseline names its level rather than leaving this empty: an empty
      # variable has to survive as set to override .cargo/config.toml, and
      # windows is not reliable about that
      RUSTFLAGS: ${{ matrix.cpu && format('-C target-cpu={0}', matrix.cpu) || '-C target-cpu=x86-64' }}
      # v2 takes the plain name, being what almost every machine can run and
      # the faster build. The arm mac has one build and keeps the plain name
      # too, which is why the baseline suffix asks about the runner.
      #
      # The empty result has to be the last arm: github treats the empty
      # string as false, so `cond && '' || other` takes the other branch.
      VARIANT: ${{ matrix.cpu == 'x86-64-v3' && '-v3' || (matrix.cpu == '' && matrix.os != 'macos-latest') && '-baseline' || '' }}
    # a job that declares permissions gets these and no others, so contents:
    # write is restated. The other two let the job ask github for a short
    # lived signing certificate with its own oidc token and file the
    # attestation against this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the runner is newer than any level built here, so a build that would
      # trap on its own instructions fails here rather than after download
      - name: Run what is about to be shipped
        run: cargo run --release --locked -- bench 2
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        id: upload
        with:
          bin: "arche"
          tar: unix
          zip: windows
          checksum: "sha256"
          archive: $bin-$tag-$target${{ env.VARIANT }}
          # the readme's relative links to the changelog and docs/
          include: LICENSE,README.md,CHANGELOG.md,docs
          # (required) GitHub token for uploading assets to GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

      # The checksum says a download arrived intact and nothing about where it
      # came from, and it is published beside the file it describes. The
      # attestation is a signed statement that these bytes came out of this
      # workflow at this commit, which `gh attestation verify` checks with
      # github rather than with the release page. How to run it is in the
      # readme.
      #
      # The subject is the checksum file, which the action names in its sha256
      # output and which lists every archive this runner built; a path would
      # have to know whether the platform made the tar or the zip.
      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.upload.outputs.sha256 }}

  # Called from here rather than run from its own tag trigger so that it waits
  # for the tests and for the release it writes to.
  docker:
    needs: create-release
    # a called workflow cannot hold more than its caller was given, so the two
    # the image's attestation needs are granted here as well as declared there
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      release: true

  # The confirmation match against the previous release, added to the release
  # notes. Five hundred games at 30+0.3 across five shards is about ninety
  # minutes of wall clock.
  #
  # The slower control is the point. A release is a batch of changes screened
  # at 10+0.1, and a change that prunes or reduces can look better there than
  # it is, because the tree it cut is worth more when both sides search
  # deeper. Five hundred games settle about twenty five elo either side: enough
  # to show a batch that gave back most of what it claimed, not enough to
  # settle a difference of five, so the estimate is read as a check on the
  # batch.
  strength:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/strength.yml
    with:
      games: 500
      shards: 5
      time_control: 30+0.3
      publish: true

  # Places the release on the ccrl scale by playing rated opponents.
  #
  # After strength rather than alongside it, so the two do not race to build
  # the same fastchess cache from cold and no more than two jobs are ever
  # queued to edit the release notes, which is the most that queue holds
  # without dropping one.
  #
  # The condition makes that sequencing rather than dependency: this needs
  # nothing strength produces, so a strength match that failed or had no
  # previous release must not take the estimate down with it. Cancelled is
  # excluded so that calling off a release does not still spend an hour of
  # runner.
  calibrate:
    needs: [create-release, strength]
    if: ${{ !cancelled() && needs.create-release.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/calibrate.yml
    with:
      games: 50
      publish: true
