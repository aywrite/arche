name: Strength

# Plays one version of the engine against another and reports the elo
# difference. By default it is the ref this was run against versus the last
# full release, which is what the release workflow wants. Both sides can be
# named instead, as a branch, a tag, a commit or a pull request number.
#
# A runner plays about three and a third games a minute at 10+0.1 and about
# one and a tenth at 30+0.3, and play is capped at 150 minutes, so a match
# worth reading is split across shards that play at once and are pooled
# afterwards. Each shard plays its own slice of the book, chosen from the seed,
# so no two shards play the same opening and the schedule can be replayed from
# the manifest.
#
# The estimate over the pooled games is worked out here rather than taken from
# fastchess, which only sees its own shard. The figure and its interval are
# read off pairs, since the two games of an opening are one draw and not two;
# a game the pairing left over is in the score and in nothing else.
#
# sprt reads the same pooled games as a sequential test of whether the
# candidate is stronger. The shards play their slices with nothing watching;
# the summary adds their pairs to the pairs the earlier batches played and
# judges the log likelihood ratio over all of them. A batch that settles it
# says passed or failed; one that does not says inconclusive and the pairs to
# launch the next batch with. Looking only at batch boundaries is what lets the
# shards play at once and leaves the bounds meaning what they say.
#
# `batches` chains that inside one run: up to four batches, each played only
# where the one before settled nothing. A test that decides early stops
# playing, and one that does not hands back the pairs for a second run to carry
# on from. The batches share a seed and reserve the book between them, so no
# two play the same opening.
#
# Every shard keeps its games, the result block, the fastchess config and a
# manifest as strength-<run id>-<attempt>-shard-<i>, with -batch-<n> before the
# shard where the run played more than one.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: What to test. A branch, tag, commit or pull request number. Defaults to the ref this is run against.
        type: string
      baseline:
        description: What to measure it against. Same forms. Defaults to the last full release.
        type: string
      games:
        description: Games to play, split between the shards and rounded down to an even number each. With sprt this is one batch of the test, not a cap.
        type: number
        default: 500
      shards:
        description: Jobs to split the games across.
        type: number
        default: 5
      time_control:
        description: Passed to fastchess as tc
        type: string
        default: 10+0.1
      book:
        description: The opening set the run plays, one of the books in scripts/book.sh. Figures on different books are not comparable.
        type: string
        default: 8moves_v3
      sprt:
        description: Ask whether the candidate is stronger rather than how much. The run is a sequential test read over every pair its batches play.
        type: boolean
        default: false
      batches:
        description: Batches of the sprt to chain in this run, one to four. Each is played only where the one before settled nothing, so it is a cap rather than a plan.
        type: number
        default: 1
      elo0:
        description: SPRT null hypothesis, in elo. Accepting it (H0) means the candidate is not stronger.
        type: number
        default: 0
      elo1:
        description: SPRT alternative, in elo. Accepting it (H1) means the candidate is stronger by about this much or more.
        type: number
        default: 10
      prior_pairs:
        description: The pairs the earlier runs of this test played, by what the candidate scored in them, as the summary of the last one printed them. Left empty this run opens the test.
        type: string
        default: ""
      seed:
        description: Seed for the region of the book the shards play, an unsigned integer. Left empty it is the run id, and either way the manifest records it.
        type: string
  workflow_call:
    inputs:
      candidate:
        type: string
        required: false
      baseline:
        type: string
        required: false
      games:
        type: number
        default: 500
      shards:
        type: number
        default: 5
      time_control:
        type: string
        default: 10+0.1
      book:
        type: string
        default: 8moves_v3
      sprt:
        type: boolean
        default: false
      batches:
        type: number
        default: 1
      elo0:
        type: number
        default: 0
      elo1:
        type: number
        default: 10
      prior_pairs:
        type: string
        default: ""
      seed:
        type: string
      publish:
        description: Append the result to the release notes for this tag
        type: boolean
        default: false
      # What the match is played on rather than what it plays, so not boxes
      # on the actions tab. A workflow calling this can name them.
      hash_mb:
        description: The table both sides are given, in MB. 256 is what the engine defaults to, and naming it holds both sides to the same table whatever a future default is.
        type: number
        default: 256
      concurrency:
        description: Games a shard plays at once
        type: number
        default: 2
      max_match_minutes:
        description: The wall clock cap on play alone. The play job's timeout is this plus half an hour, so a shard stopped by the clock still keeps its games. A hundred game shard is about ninety minutes at 30+0.3 and half an hour at 10+0.1, so the default is headroom rather than a budget.
        type: number
        default: 150
      startup_ms:
        description: How long fastchess waits for an engine to answer uci. The engine allocates its table before it answers, which four copies starting at once can take longer over than the ten second default.
        type: number
        default: 20000
      # Marks this workflow's line in the release notes, so a rerun replaces
      # its own line. The job below repeats the default, as the expressions
      # that read the other call inputs do.
      marker:
        description: Identifies this workflow's line in the release notes
        type: string
        default: arche:strength

permissions:
  contents: read

jobs:
  # Split out so the match can be skipped in one place when there is nothing
  # to compare against. A matrix is a list, not a number, so the shard list is
  # made here and read back with fromJSON.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      baseline_name: ${{ steps.baseline.outputs.name }}
      baseline_sha: ${{ steps.baseline.outputs.sha }}
      candidate_name: ${{ steps.candidate.outputs.name }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      pairs: ${{ steps.plan.outputs.pairs }}
      book: ${{ steps.plan.outputs.book }}
      play_timeout: ${{ steps.plan.outputs.play_timeout }}
      # An input reaches a dispatch run as a string whatever its type says,
      # and reaches a call as the type it declares. A job output is a string
      # either way, so reading these back off one is what makes the stages
      # below type correct under both.
      batches: ${{ inputs.batches }}
      sprt: ${{ inputs.sprt }}
      elo0: ${{ inputs.elo0 }}
      elo1: ${{ inputs.elo1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Before a runner builds anything, and here rather than in plan-shards
      # because it is this file's ladder that sets the ceiling, not the plan.
      - name: Check the test fits the ladder
        env:
          BATCHES: ${{ inputs.batches }}
          SPRT: ${{ inputs.sprt }}
        run: |
          [ "$BATCHES" -ge 1 ] && [ "$BATCHES" -le 4 ] || {
            echo "::error::batches is 1 to 4, the stages this workflow has, and was ${BATCHES}. A longer test is carried on by a second run, with prior_pairs"
            exit 1
          }
          # A run that is not a sequential test has no verdict, so every stage
          # after the first would skip and the run would quietly play one
          # batch of the several it was asked for.
          [ "$BATCHES" -eq 1 ] || [ "$SPRT" = "true" ] || {
            echo "::error::batches is ${BATCHES} and sprt is off. Only a sequential test has a verdict for the next batch to wait on; without one, ask for the games you want in one batch"
            exit 1
          }

      - uses: aywrite/mache/actions/resolve-ref@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: candidate
        with:
          ref: ${{ inputs.candidate }}
          label: candidate
          # nothing named means the commit this was dispatched on
          when_empty: head

      - uses: aywrite/mache/actions/resolve-ref@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: baseline
        with:
          ref: ${{ inputs.baseline }}
          label: baseline
          # nothing named means the last full release: no candidates, and not
          # the tag being released
          when_empty: last-release

      - name: Say so when there is nothing to compare against
        if: steps.baseline.outputs.sha == ''
        run: echo "::notice::No previous release to compare against, skipping"

      - uses: aywrite/mache/actions/plan-shards@a429bcecb0b5718c0ef9fe8c02f0b360d986635b # v0.5.0
        id: plan
        with:
          games: ${{ inputs.games }}
          shards: ${{ inputs.shards }}
          sprt: ${{ inputs.sprt }}
          elo0: ${{ inputs.elo0 }}
          elo1: ${{ inputs.elo1 }}
          prior_pairs: ${{ inputs.prior_pairs }}
          book: ${{ inputs.book }}
          max_match_minutes: ${{ inputs.max_match_minutes || 150 }}

  # The batch ladder. Actions has no loop and `uses:` is not an expression, so
  # the stages are written out, and how many there are is the ceiling the job
  # above checks against. Each waits on the one before and plays only where it
  # settled nothing, which is the early stop: a decided test stops playing.
  #
  # Each guard says three things. The verdict is the early stop. `batches` is
  # the cap the caller asked for, and without it a test still running at its
  # last batch would start one more, which the book reserved no room for and
  # every shard of which would fail. `!cancelled()` is there because a shard
  # that fell over concludes the batch it was in as a failure, which would
  # otherwise skip the stage after it before its verdict was read. A shard
  # that fell over is a smaller sample, and the summary it fed still speaks
  # for the whole test; what stops the ladder is an empty verdict.
  #
  # A workflow_call default is not applied to a run started from the actions
  # tab, and the env context is not available to a job that calls a workflow,
  # so each call-only default is repeated in the expression that reads it.
  batch1:
    needs: resolve
    if: needs.resolve.outputs.baseline_sha != ''
    uses: ./.github/workflows/strength-batch.yml
    with:
      batch: 0
      batches: ${{ fromJSON(needs.resolve.outputs.batches) }}
      prior_pairs: ${{ inputs.prior_pairs }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ fromJSON(needs.resolve.outputs.count) }}
      pairs: ${{ fromJSON(needs.resolve.outputs.pairs) }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      # the seed picks the region of the book each shard plays, not a shuffle.
      # The run id is one no two runs share; a seed given by hand replays an
      # earlier run. Every stage is handed the same one, and the batch index
      # is what keeps them off each other's openings
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ fromJSON(needs.resolve.outputs.sprt) }}
      elo0: ${{ fromJSON(needs.resolve.outputs.elo0) }}
      elo1: ${{ fromJSON(needs.resolve.outputs.elo1) }}
      hash_mb: ${{ inputs.hash_mb || 256 }}
      concurrency: ${{ inputs.concurrency || 2 }}
      max_match_minutes: ${{ inputs.max_match_minutes || 150 }}
      startup_ms: ${{ inputs.startup_ms || 20000 }}

  batch2:
    needs: [resolve, batch1]
    if: >-
      !cancelled()
      && needs.batch1.outputs.verdict == 'inconclusive'
      && inputs.batches > 1
    uses: ./.github/workflows/strength-batch.yml
    with:
      batch: 1
      batches: ${{ fromJSON(needs.resolve.outputs.batches) }}
      prior_pairs: ${{ needs.batch1.outputs.carried }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ fromJSON(needs.resolve.outputs.count) }}
      pairs: ${{ fromJSON(needs.resolve.outputs.pairs) }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ fromJSON(needs.resolve.outputs.sprt) }}
      elo0: ${{ fromJSON(needs.resolve.outputs.elo0) }}
      elo1: ${{ fromJSON(needs.resolve.outputs.elo1) }}
      hash_mb: ${{ inputs.hash_mb || 256 }}
      concurrency: ${{ inputs.concurrency || 2 }}
      max_match_minutes: ${{ inputs.max_match_minutes || 150 }}
      startup_ms: ${{ inputs.startup_ms || 20000 }}

  batch3:
    needs: [resolve, batch2]
    if: >-
      !cancelled()
      && needs.batch2.outputs.verdict == 'inconclusive'
      && inputs.batches > 2
    uses: ./.github/workflows/strength-batch.yml
    with:
      batch: 2
      batches: ${{ fromJSON(needs.resolve.outputs.batches) }}
      prior_pairs: ${{ needs.batch2.outputs.carried }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ fromJSON(needs.resolve.outputs.count) }}
      pairs: ${{ fromJSON(needs.resolve.outputs.pairs) }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ fromJSON(needs.resolve.outputs.sprt) }}
      elo0: ${{ fromJSON(needs.resolve.outputs.elo0) }}
      elo1: ${{ fromJSON(needs.resolve.outputs.elo1) }}
      hash_mb: ${{ inputs.hash_mb || 256 }}
      concurrency: ${{ inputs.concurrency || 2 }}
      max_match_minutes: ${{ inputs.max_match_minutes || 150 }}
      startup_ms: ${{ inputs.startup_ms || 20000 }}

  batch4:
    needs: [resolve, batch3]
    if: >-
      !cancelled()
      && needs.batch3.outputs.verdict == 'inconclusive'
      && inputs.batches > 3
    uses: ./.github/workflows/strength-batch.yml
    with:
      batch: 3
      batches: ${{ fromJSON(needs.resolve.outputs.batches) }}
      prior_pairs: ${{ needs.batch3.outputs.carried }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ fromJSON(needs.resolve.outputs.count) }}
      pairs: ${{ fromJSON(needs.resolve.outputs.pairs) }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ fromJSON(needs.resolve.outputs.sprt) }}
      elo0: ${{ fromJSON(needs.resolve.outputs.elo0) }}
      elo1: ${{ fromJSON(needs.resolve.outputs.elo1) }}
      hash_mb: ${{ inputs.hash_mb || 256 }}
      concurrency: ${{ inputs.concurrency || 2 }}
      max_match_minutes: ${{ inputs.max_match_minutes || 150 }}
      startup_ms: ${{ inputs.startup_ms || 20000 }}

  # The line is the last batch that played, since its summary read every pair
  # the test played and not just its own.
  release-notes:
    needs: [batch1, batch2, batch3, batch4]
    # A batch that played reports a line whether or not every shard of it
    # came back, so the line rather than the result is what says a stage
    # reported. A stage that played and reported nothing is the case to catch:
    # the coalescing below would fall back to the stage before it, and publish
    # a figure over part of the test under the whole test's name.
    if: >-
      !cancelled() && inputs.publish
      && needs.batch1.outputs.line != ''
      && (needs.batch2.result == 'skipped' || needs.batch2.outputs.line != '')
      && (needs.batch3.result == 'skipped' || needs.batch3.outputs.line != '')
      && (needs.batch4.result == 'skipped' || needs.batch4.outputs.line != '')
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
    with:
      marker: ${{ inputs.marker || 'arche:strength' }}
      line: ${{ needs.batch4.outputs.line || needs.batch3.outputs.line || needs.batch2.outputs.line || needs.batch1.outputs.line }}
