name: Strength

# Plays one version of the engine against another and reports the elo
# difference. By default it is whatever it was run against versus the last full
# release, which is what the release workflow wants. Both sides can be named
# instead, as a branch, a tag, a commit or a pull request number, so a change
# can be measured before it is merged and against something other than a
# release.
#
# Fifty games only separates versions that differ by a hundred elo or so. A
# change worth a handful needs thousands, so raise the count and shorten the
# time control when the answer matters.
#
# Or ask the narrower question instead: sprt runs a sequential test that stops
# the moment the games so far settle whether the candidate is stronger, rather
# than playing a count chosen in advance. games then caps the match instead of
# sizing it, so it can be set generously, and a match that reaches the cap, or
# the time cap below, reports inconclusive rather than pretending the games it
# played were enough.
#
# Every run keeps what it would take to look into its own result: the games with
# the search figures behind each move, the result block, the fastchess config
# and a manifest of what was played on what. They are uploaded as an artifact
# named strength-<run id>. The opening order is seeded, and the seed is in the
# manifest, so the same schedule can be played again.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: What to test. A branch, tag, commit or pull request number. Defaults to the ref this is run against.
        type: string
      baseline:
        description: What to measure it against. Same forms. Defaults to the last full release.
        type: string
      games:
        description: Games to play, rounded down to an even number. With sprt this is the cap, not the size, so set it generously.
        type: number
        default: 50
      time_control:
        description: Passed to fastchess as tc
        type: string
        default: 10+0.1
      sprt:
        description: Stop as soon as the games settle whether the candidate is stronger, instead of playing them all
        type: boolean
        default: false
      elo0:
        description: SPRT null hypothesis, in elo. Accepting it (H0) means the candidate is not stronger.
        type: number
        default: 0
      elo1:
        description: SPRT alternative, in elo. Accepting it (H1) means the candidate is stronger by about this much or more.
        type: number
        default: 10
      seed:
        description: Seed for the random opening order. Left empty it is the run id, and either way the manifest records it.
        type: string
  workflow_call:
    inputs:
      candidate:
        type: string
        required: false
      baseline:
        type: string
        required: false
      games:
        type: number
        default: 50
      time_control:
        type: string
        default: 10+0.1
      sprt:
        type: boolean
        default: false
      elo0:
        type: number
        default: 0
      elo1:
        type: number
        default: 10
      seed:
        type: string
      publish:
        description: Append the result to the release notes for this tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Split out so the match job can be skipped in one place rather than every
  # step having to ask whether there is anything to compare against.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      baseline_name: ${{ steps.find.outputs.baseline_name }}
      baseline_sha: ${{ steps.find.outputs.baseline_sha }}
      candidate_name: ${{ steps.find.outputs.candidate_name }}
      candidate_sha: ${{ steps.find.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out what is playing what
        id: find
        env:
          CANDIDATE: ${{ inputs.candidate }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          if [ -n "$CANDIDATE" ]; then
            sha=$(scripts/resolve_ref.sh "$CANDIDATE") \
              || { echo "::error::cannot resolve candidate ${CANDIDATE}"; exit 1; }
            echo "candidate_name=${CANDIDATE}" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=${sha}" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$BASELINE" ]; then
            sha=$(scripts/resolve_ref.sh "$BASELINE") \
              || { echo "::error::cannot resolve baseline ${BASELINE}"; exit 1; }
            echo "baseline_name=${BASELINE}" >> "$GITHUB_OUTPUT"
            echo "baseline_sha=${sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Release candidates are not a baseline worth measuring against, and a
          # release is compared with the one before it rather than with itself.
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                | grep -v -- '-' \
                | grep -v -x "$GITHUB_REF_NAME" \
                | head -1)
          echo "baseline_name=${tag}" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No previous release to compare against, skipping"
          else
            echo "baseline_sha=$(git rev-parse "${tag}^{commit}")" >> "$GITHUB_OUTPUT"
          fi

  match:
    needs: resolve
    if: needs.resolve.outputs.baseline_sha != ''
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.summary.outputs.line }}
    # enough for about five hundred games at the time control above, a run that
    # wants more is better split up
    timeout-minutes: 180
    defaults:
      run:
        # naming the shell is what turns on pipefail, without it a fastchess
        # that died is hidden by the tee it is piped into
        shell: bash
    env:
      GAMES: ${{ inputs.games }}
      TIME_CONTROL: ${{ inputs.time_control }}
      SPRT: ${{ inputs.sprt }}
      ELO0: ${{ inputs.elo0 }}
      ELO1: ${{ inputs.elo1 }}
      # the openings are drawn at random, so without a seed the schedule is
      # gone the moment the run ends. The run id is one nobody has to choose
      # and no two runs share; a seed given by hand replays an earlier run
      SEED: ${{ inputs.seed || github.run_id }}
      # 256MB is what the engine defaults to. Naming it here holds the two
      # sides to the same table whatever a future default is, and puts the
      # number in the manifest with the rest of what the match was played on
      HASH: 256
      CONCURRENCY: 2
      # the wall clock cap on play alone. It sits inside the job's timeout with
      # room for the builds before it and the summary after, so a match stopped
      # by the clock still reports the games it did play
      MAX_MATCH_MINUTES: 150
      CANDIDATE: ${{ needs.resolve.outputs.candidate_name }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      PREVIOUS: ${{ needs.resolve.outputs.baseline_name }}
      BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/match-tools
        id: tools

      # the cache keeps the dependencies; each side's engine is built from an
      # export of its commit, and the checkout stays on the ref this ran on
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build both versions
        run: |
          # a pull request head is not fetched by default and the resolve job
          # ran on a different machine, so fetch anything not already here
          for sha in "$CANDIDATE_SHA" "$BASELINE_SHA"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null \
              || git fetch -q origin "$sha" \
              || git fetch -q origin "+refs/pull/*/head:refs/remotes/pull/*"
          done
          scripts/build_at.sh "$CANDIDATE_SHA" tools/new
          scripts/build_at.sh "$BASELINE_SHA" tools/old

      - name: Play the match
        working-directory: tools
        run: |
          # only fastchess and the book are cached, but a rerun on the same
          # runner would still find the last attempt's games lying here, and
          # fastchess appends to a pgn it is given
          rm -f games.pgn result.txt config.json terminations.txt
          sprt=()
          if [ "$SPRT" = "true" ]; then
            # logistic keeps the bounds in the same elo the summary reports.
            # Alpha and beta are the error rates the verdicts are accepted at:
            # a wrong H1 one run in twenty, a wrong H0 the same
            sprt=(-sprt "elo0=$ELO0" "elo1=$ELO1" alpha=0.05 beta=0.05 model=logistic)
          fi
          # the engine allocates its transposition table before it answers
          # uci, which four copies starting at once can take longer over than
          # the ten second default allows.
          #
          # The pgn carries everything fastchess can record about a move, so a
          # game that went wrong can be read for what the search was seeing at
          # the time. tbhits is left off; there are no tablebases here.
          #
          # INT is the signal fastchess takes as a request to stop, report the
          # games played so far and exit, and 124 is how timeout says it had to
          # send it. An sprt match that never settles is stopped by the games
          # cap or this clock, whichever arrives first; either way the summary
          # step still runs on what was played
          status=0
          timeout -k 60 -s INT "${MAX_MATCH_MINUTES}m" ./fastchess \
            -engine "name=$CANDIDATE" cmd=./new \
            -engine "name=$PREVIOUS" cmd=./old \
            -each proto=uci "tc=$TIME_CONTROL" "option.Hash=$HASH" -startup-ms 20000 \
            -openings file=8moves_v3.pgn format=pgn order=random -srand "$SEED" \
            -rounds "$((GAMES / 2))" -repeat -concurrency "$CONCURRENCY" -recover \
            "${sprt[@]}" \
            -pgnout file=games.pgn nodes=true seldepth=true nps=true \
              hashfull=true timeleft=true latency=true pv=true \
            | tee result.txt || status=$?
          # what stopped the match, for the manifest. The clock cap is the one
          # reading a result has to know about, because it is the one that
          # leaves the question the games were meant to settle unanswered
          if [ "$status" = "124" ]; then
            echo "STOPPED_BY=the ${MAX_MATCH_MINUTES} minute wall clock cap" >> "$GITHUB_ENV"
            echo "::warning::The match hit the ${MAX_MATCH_MINUTES} minute cap before the game count"
          elif [ "$status" != "0" ]; then
            exit "$status"
          else
            echo "STOPPED_BY=fastchess, at the game count or an sprt bound" >> "$GITHUB_ENV"
          fi

      - name: Summarise the result
        id: summary
        run: |
          # how the games ended, counted from the games themselves rather than
          # guessed at from the words in the result block. The losses a crash
          # or the clock cost stay in the estimate, because choosing what to
          # count after seeing it is not a measurement; the counts sit beside
          # it instead. Anything worth an alert comes back on stderr, as the
          # rating estimate's remarks do. A count that cannot be made is a
          # warning and not a failure: the elo line below is the run's answer,
          # and the games go up as an artifact whatever this step does
          python3 scripts/match_terminations.py tools/games.pgn \
            > tools/terminations.txt 2> tools/remarks.txt \
            || echo "::warning::The games could not be counted, the block below is incomplete"
          while read -r remark; do
            echo "::warning::${remark}"
          done < tools/remarks.txt
          line="Performance compared to ${PREVIOUS} | $(python3 scripts/match_summary.py tools/result.txt)"
          echo "::notice::$line"
          echo "line=${line}" >> "$GITHUB_OUTPUT"
          # the same result as the trailer a commit carries, ready to paste
          trailer=$(python3 scripts/match_summary.py tools/result.txt \
            --trailer --tc "$TIME_CONTROL" --baseline "$PREVIOUS")
          {
            echo "${CANDIDATE} (\`${CANDIDATE_SHA:0:8}\`) against ${PREVIOUS} (\`${BASELINE_SHA:0:8}\`)"
            echo
            echo "$line"
            echo
            echo "As the trailer for the commit that made the difference:"
            echo
            echo '```'
            echo "$trailer"
            echo '```'
            echo
            if [ "$SPRT" = "true" ]; then
              echo "SPRT stops when the games settle the question at a five percent error rate each way: passed (H1 accepted) means stronger by about ${ELO1} elo or more, failed (H0 accepted) means not, and inconclusive means the cap of ${GAMES} games or ${MAX_MATCH_MINUTES} minutes arrived first."
            else
              echo "At ${GAMES} games only a difference of about $(python3 -c "print(int(800/(${GAMES}**0.5)))") elo can be told from none."
            fi
            echo
            echo "How the games ended:"
            echo
            echo '```'
            cat tools/terminations.txt
            echo '```'
            echo
            echo "The games, the result and a manifest of what was played are kept"
            echo "as the \`strength-${GITHUB_RUN_ID}\` artifact. The openings came from"
            echo "seed ${SEED}, which replays this schedule."
          } >> "$GITHUB_STEP_SUMMARY"

      # What it would take to play this match again, and what it was played
      # on. Written whether or not the match finished, since a run that ended
      # badly is the one that gets looked into.
      - name: Write the manifest
        if: always()
        env:
          FASTCHESS: ${{ steps.tools.outputs.fastchess }}
        run: |
          book_sha=$(sha256sum tools/8moves_v3.pgn | cut -d' ' -f1) || book_sha=unknown
          toolchain=$(rustc -V) || toolchain=unknown
          {
            echo "candidate: ${CANDIDATE}"
            echo "candidate_sha: ${CANDIDATE_SHA}"
            echo "baseline: ${PREVIOUS}"
            echo "baseline_sha: ${BASELINE_SHA}"
            echo "build: scripts/build_at.sh, cargo build --release on an export of the commit"
            echo "fastchess: ${FASTCHESS}"
            echo "book: 8moves_v3.pgn"
            echo "book_sha256: ${book_sha}"
            echo "seed: ${SEED}"
            echo "time_control: ${TIME_CONTROL}"
            echo "hash_mb: ${HASH}"
            echo "concurrency: ${CONCURRENCY}"
            if [ "$SPRT" = "true" ]; then
              echo "games: ${GAMES} (a cap, the sprt stops the match itself)"
              echo "sprt: elo0=${ELO0} elo1=${ELO1} alpha=0.05 beta=0.05 model=logistic"
            else
              echo "games: ${GAMES}"
              echo "sprt: off"
            fi
            echo "wall_clock_cap_minutes: ${MAX_MATCH_MINUTES}"
            # unset when the match step never got to the end, which is worth
            # saying rather than leaving the games to look as if they ran out
            echo "stopped_by: ${STOPPED_BY:-not recorded, the match did not finish}"
            echo "runner: $(uname -a)"
            echo "cores: $(nproc)"
            echo "rustc: ${toolchain}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > tools/manifest.txt
          # the counts the summary printed, so that one file describes the run
          if [ -f tools/terminations.txt ]; then
            cat tools/terminations.txt >> tools/manifest.txt
          fi
          cat tools/manifest.txt

      # The games are the only record of what actually happened, and a rerun
      # plays different ones. fastchess writes its own config.json beside them,
      # which says what it was asked for; the manifest says the rest.
      - name: Keep the games
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strength-${{ github.run_id }}
          path: |
            tools/games.pgn
            tools/result.txt
            tools/config.json
            tools/manifest.txt
          if-no-files-found: warn

  release-notes:
    needs: match
    if: inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
    with:
      marker: arche:strength
      line: ${{ needs.match.outputs.line }}
