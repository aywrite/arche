name: Strength

# Plays one version of the engine against another and reports the elo
# difference. By default it is whatever it was run against versus the last full
# release, which is what the release workflow wants. Both sides can be named
# instead, as a branch, a tag, a commit or a pull request number, so a change
# can be measured before it is merged and against something other than a
# release.
#
# A runner plays about three and a third games a minute at 10+0.1 and about one
# and a tenth at 30+0.3, and play is capped at 150 minutes, so a match worth
# reading is more games than one job can hold. The games are split across shards
# that play at the same time and are pooled afterwards. Each shard plays a slice
# of the opening book of its own, chosen from the seed, so no two shards play
# the same opening and the schedule can be played again from the manifest.
#
# The estimate over the pooled games is worked out here rather than taken from
# fastchess, which only ever sees the one shard it ran. The figure and its
# interval are both read off pairs, since the two games of an opening are one
# draw and not two, and a game the pairing left over is in the score and in
# nothing else.
#
# Or ask the narrower question instead: sprt reads the same pooled games as a
# sequential test of whether the candidate is stronger. A run is one batch of
# it. The shards play their slices with nothing watching, the summary adds the
# pairs they played to the pairs the earlier batches of the same test played
# and judges the log likelihood ratio over all of them against the bounds. A
# batch that settles it says passed or failed; one that does not says
# inconclusive and the pairs to launch the next batch with. Looking at the
# batch boundaries rather than after every game is what lets the shards play at
# once and leaves the bounds meaning what they say.
#
# Every run keeps what it would take to look into its own result: the games with
# the search figures behind each move, the result block, the fastchess config
# and a manifest of what was played on what. They go up a shard at a time, as
# strength-<run id>-<attempt>-shard-<i>. The opening slices come from the seed,
# and the seed is in every manifest, so the same schedule can be played again.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: What to test. A branch, tag, commit or pull request number. Defaults to the ref this is run against.
        type: string
      baseline:
        description: What to measure it against. Same forms. Defaults to the last full release.
        type: string
      games:
        description: Games to play, split between the shards and rounded down to an even number each. With sprt this is one batch of the test, not a cap.
        type: number
        default: 500
      shards:
        description: Jobs to split the games across.
        type: number
        default: 5
      time_control:
        description: Passed to fastchess as tc
        type: string
        default: 10+0.1
      book:
        description: The opening set the run plays, one of the books in scripts/book.sh. Figures on different books are not comparable.
        type: string
        default: 8moves_v3
      sprt:
        description: Ask whether the candidate is stronger rather than how much. This run is one batch of a sequential test, read together with the batches before it.
        type: boolean
        default: false
      elo0:
        description: SPRT null hypothesis, in elo. Accepting it (H0) means the candidate is not stronger.
        type: number
        default: 0
      elo1:
        description: SPRT alternative, in elo. Accepting it (H1) means the candidate is stronger by about this much or more.
        type: number
        default: 10
      prior_pairs:
        description: The pairs the earlier batches of this test played, by what the candidate scored in them, as the summary of the last one printed them. Left empty this batch is the first.
        type: string
        default: ""
      seed:
        description: Seed for the region of the book the shards play, an unsigned integer. Left empty it is the run id, and either way the manifest records it.
        type: string
  workflow_call:
    inputs:
      candidate:
        type: string
        required: false
      baseline:
        type: string
        required: false
      games:
        type: number
        default: 500
      shards:
        type: number
        default: 5
      time_control:
        type: string
        default: 10+0.1
      book:
        type: string
        default: 8moves_v3
      sprt:
        type: boolean
        default: false
      elo0:
        type: number
        default: 0
      elo1:
        type: number
        default: 10
      prior_pairs:
        type: string
        default: ""
      seed:
        type: string
      publish:
        description: Append the result to the release notes for this tag
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 256MB is what the engine defaults to. Naming it here holds the two sides to
  # the same table whatever a future default is, and puts the number in the
  # manifest with the rest of what the match was played on.
  HASH: 256
  CONCURRENCY: 2
  # The wall clock cap on play alone. It sits inside the job's timeout with room
  # for the builds before it and the upload after it, so a shard stopped by the
  # clock still keeps the games it did play. A hundred game shard is about
  # ninety minutes at 30+0.3 and half an hour at 10+0.1, so this is headroom for
  # a slow runner rather than a budget to be spent.
  MAX_MATCH_MINUTES: 150

jobs:
  # Split out so the match can be skipped in one place rather than every step
  # having to ask whether there is anything to compare against. It also works
  # out the matrix, because a matrix cannot be built from a number: it is a
  # list, so the list is made here and read back with fromJSON.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      baseline_name: ${{ steps.find.outputs.baseline_name }}
      baseline_sha: ${{ steps.find.outputs.baseline_sha }}
      candidate_name: ${{ steps.find.outputs.candidate_name }}
      candidate_sha: ${{ steps.find.outputs.candidate_sha }}
      shards: ${{ steps.split.outputs.shards }}
      count: ${{ steps.split.outputs.count }}
      pairs: ${{ steps.split.outputs.pairs }}
      book: ${{ steps.book.outputs.book }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out what is playing what
        id: find
        env:
          CANDIDATE: ${{ inputs.candidate }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          if [ -n "$CANDIDATE" ]; then
            sha=$(scripts/resolve_ref.sh "$CANDIDATE") \
              || { echo "::error::cannot resolve candidate ${CANDIDATE}"; exit 1; }
            echo "candidate_name=${CANDIDATE}" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=${sha}" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$BASELINE" ]; then
            sha=$(scripts/resolve_ref.sh "$BASELINE") \
              || { echo "::error::cannot resolve baseline ${BASELINE}"; exit 1; }
            echo "baseline_name=${BASELINE}" >> "$GITHUB_OUTPUT"
            echo "baseline_sha=${sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Release candidates are not a baseline worth measuring against, and a
          # release is compared with the one before it rather than with itself.
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                | grep -v -- '-' \
                | grep -v -x "$GITHUB_REF_NAME" \
                | head -1)
          echo "baseline_name=${tag}" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No previous release to compare against, skipping"
          else
            echo "baseline_sha=$(git rev-parse "${tag}^{commit}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out the shards
        id: split
        env:
          GAMES: ${{ inputs.games }}
          SHARDS: ${{ inputs.shards }}
          SPRT: ${{ inputs.sprt }}
          ELO0: ${{ inputs.elo0 }}
          ELO1: ${{ inputs.elo1 }}
          # an emptied box arrives as the empty string, which is the same
          # ask as the default: this batch is the first of its test
          PRIOR_PAIRS: ${{ inputs.prior_pairs }}
        run: |
          if [ "$SHARDS" -lt 1 ]; then
            echo "::error::shards must be at least one, got ${SHARDS}"
            exit 1
          fi
          # The summary is the first thing that reads the sprt inputs, at the
          # end, so a mistyped one would otherwise cost a batch that has
          # already been played. The boxes take free text whatever they say
          if [ "$SPRT" = "true" ]; then
            number='^-?[0-9]+(\.[0-9]+)?$'
            for value in "$ELO0" "$ELO1"; do
              if ! [[ "$value" =~ $number ]]; then
                echo "::error::elo0 and elo1 must be numbers, got ${ELO0} and ${ELO1}"
                exit 1
              fi
            done
            # a count for each of the five scores a pair can end on, which is
            # what the summary of the last batch printed. A ratio typed in
            # here is the old shape of this box and is not one. The spaces a
            # paste picks up are dropped rather than refused, as the summary
            # drops them, and the digits are capped where the summary caps
            # them
            PRIOR_PAIRS="${PRIOR_PAIRS//[[:space:]]/}"
            if [ -n "$PRIOR_PAIRS" ] \
               && ! [[ "$PRIOR_PAIRS" =~ ^[0-9]{1,8}(,[0-9]{1,8}){4}$ ]]; then
              echo "::error::prior_pairs is a count for each of the five pair scores, got ${PRIOR_PAIRS}"
              exit 1
            fi
            if ! awk -v null="$ELO0" -v alternative="$ELO1" \
                 'BEGIN { exit !(null < alternative) }'; then
              echo "::error::elo0 must be below elo1, got ${ELO0} and ${ELO1}"
              exit 1
            fi
          fi
          # every shard plays whole pairs, since a pair is the unit the games
          # are read in, so its games are rounded down to an even number and the
          # run plays a little under what was asked for
          pairs=$((GAMES / SHARDS / 2))
          if [ "$pairs" -lt 1 ]; then
            echo "::error::${GAMES} games across ${SHARDS} shards is under a pair each"
            exit 1
          fi
          batch=""
          if [ "$SPRT" = "true" ]; then
            batch=", one batch of the sprt"
          fi
          if [ "$SHARDS" = "1" ]; then
            echo "::notice::one shard of $((pairs * 2)) games${batch}"
          else
            echo "::notice::$((pairs * 2)) games in each of ${SHARDS} shards, $((pairs * 2 * SHARDS)) in all${batch}"
          fi
          echo "pairs=${pairs}" >> "$GITHUB_OUTPUT"
          # the list the matrix is built from, and the count of it, which is
          # what the slices are cut for and what the summary counts against
          echo "shards=[$(seq -s, 0 $((SHARDS - 1)))]" >> "$GITHUB_OUTPUT"
          echo "count=${SHARDS}" >> "$GITHUB_OUTPUT"

      # The book the shards play. The names are the blocks in scripts/book.sh,
      # which is also where the file, the format and the sha256 come from, and
      # a name it does not know is refused here rather than by a shard that has
      # already built two engines.
      - name: Work out the book
        id: book
        env:
          BOOK: ${{ inputs.book }}
        run: |
          # the list is held rather than piped into grep, so that grep -q
          # leaving early cannot fail the step under pipefail. -F and -x, so a
          # box holding a metacharacter or nothing at all is a name the table
          # does not have rather than a pattern
          known=$(scripts/book.sh list)
          if ! grep -Fxq -- "$BOOK" <<< "$known"; then
            echo "::error::book ${BOOK} is not one of $(tr '\n' ' ' <<< "$known")"
            exit 1
          fi
          echo "::notice::playing the ${BOOK} book"
          echo "book=${BOOK}" >> "$GITHUB_OUTPUT"

  play:
    needs: resolve
    if: needs.resolve.outputs.baseline_sha != ''
    runs-on: ubuntu-latest
    strategy:
      # one shard that fell over is a smaller sample and not a lost run, so the
      # others play on and the summary reports what arrived
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.resolve.outputs.shards) }}
    # the play cap above with room for the builds before it
    timeout-minutes: 180
    defaults:
      run:
        # naming the shell is what turns on pipefail, without it a fastchess
        # that died is hidden by the tee it is piped into
        shell: bash
    env:
      SHARD: ${{ matrix.shard }}
      # the shards the match is actually playing, which is what the slices are
      # cut for
      SHARDS: ${{ needs.resolve.outputs.count }}
      PAIRS: ${{ needs.resolve.outputs.pairs }}
      TIME_CONTROL: ${{ inputs.time_control }}
      # the book the resolve job accepted rather than the input it read, so a
      # shard plays what was checked
      BOOK: ${{ needs.resolve.outputs.book }}
      SPRT: ${{ inputs.sprt }}
      ELO0: ${{ inputs.elo0 }}
      ELO1: ${{ inputs.elo1 }}
      PRIOR_PAIRS: ${{ inputs.prior_pairs }}
      # the openings are taken in book order from an offset, so the seed picks
      # the region of the book each shard plays rather than a shuffle. The run
      # id is one nobody has to choose and no two runs share; a seed given by
      # hand replays an earlier run
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate_name }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      PREVIOUS: ${{ needs.resolve.outputs.baseline_name }}
      BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/match-tools
        id: tools

      # the cache keeps the dependencies; each side's engine is built from an
      # export of its commit, and the checkout stays on the ref this ran on
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build both versions
        run: |
          # a pull request head is not fetched by default and the resolve job
          # ran on a different machine, so fetch anything not already here
          for sha in "$CANDIDATE_SHA" "$BASELINE_SHA"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null \
              || git fetch -q origin "$sha" \
              || git fetch -q origin "+refs/pull/*/head:refs/remotes/pull/*"
          done
          scripts/build_at.sh "$CANDIDATE_SHA" tools/new
          scripts/build_at.sh "$BASELINE_SHA" tools/old

      # Which openings this shard plays. The book is counted here rather than
      # written down, because a book that changed size would otherwise move
      # every shard but the first onto its neighbour's openings. What counting
      # means depends on the book, a game for a pgn and a line for an epd,
      # which is why scripts/book.sh is asked rather than grep. The file and
      # the format are carried on from here because the match runs in tools/,
      # where the script is not.
      - name: Work out the slice of the book
        run: |
          book_file=$(scripts/book.sh file "$BOOK")
          book_format=$(scripts/book.sh format "$BOOK")
          openings=$(scripts/book.sh count "$BOOK" "tools/${book_file}") \
            || { echo "::error::no openings in the book"; exit 1; }
          start=$(python3 scripts/book_slice.py --openings "$openings" \
            --pairs "$PAIRS" --shards "$SHARDS" --shard "$SHARD" --seed "$SEED" \
            2> slice.txt) || { echo "::error::$(cat slice.txt)"; exit 1; }
          while read -r remark; do
            echo "::warning::${remark}"
          done < slice.txt
          echo "BOOK_FILE=${book_file}" >> "$GITHUB_ENV"
          echo "BOOK_FORMAT=${book_format}" >> "$GITHUB_ENV"
          echo "OPENINGS=${openings}" >> "$GITHUB_ENV"
          echo "START=${start}" >> "$GITHUB_ENV"

      - name: Play the shard
        working-directory: tools
        run: |
          # only fastchess and the book are cached, but a rerun on the same
          # runner would still find the last attempt's games lying here, and
          # fastchess appends to a pgn it is given
          rm -f games.pgn result.txt config.json
          # No -sprt, sharded or not. A shard that stopped itself the moment
          # its own games settled the question would be one look per shard at a
          # bound meant for one look, and its games would be a slice chosen by
          # what they said. The shards play their pairs out and the summary
          # runs the test over all of them at once.
          #
          # the engine allocates its transposition table before it answers
          # uci, which four copies starting at once can take longer over than
          # the ten second default allows.
          #
          # The pgn carries everything fastchess can record about a move, so a
          # game that went wrong can be read for what the search was seeing at
          # the time. tbhits is left off; there are no tablebases here.
          #
          # INT is the signal fastchess takes as a request to stop, report the
          # games played so far and exit, and 124 is how timeout says it had to
          # send it. A shard stopped that way played fewer games, and the
          # summary says so rather than losing the run
          status=0
          timeout -k 60 -s INT "${MAX_MATCH_MINUTES}m" ./fastchess \
            -engine "name=$CANDIDATE" cmd=./new \
            -engine "name=$PREVIOUS" cmd=./old \
            -each proto=uci "tc=$TIME_CONTROL" "option.Hash=$HASH" -startup-ms 20000 \
            -openings "file=$BOOK_FILE" "format=$BOOK_FORMAT" order=sequential "start=$START" \
            -rounds "$PAIRS" -repeat -concurrency "$CONCURRENCY" -recover \
            -pgnout file=games.pgn nodes=true seldepth=true nps=true \
              hashfull=true timeleft=true latency=true pv=true \
            | tee result.txt || status=$?
          # what stopped the shard, for the manifest. The clock cap is the one
          # reading a result has to know about, because it is the one that
          # leaves the question the games were meant to settle unanswered
          if [ "$status" = "124" ]; then
            echo "STOPPED_BY=the ${MAX_MATCH_MINUTES} minute wall clock cap" >> "$GITHUB_ENV"
            echo "::warning::shard ${SHARD} hit the ${MAX_MATCH_MINUTES} minute cap before its game count"
          elif [ "$status" != "0" ]; then
            exit "$status"
          else
            echo "STOPPED_BY=fastchess, at the game count" >> "$GITHUB_ENV"
          fi

      # What it would take to play this shard again, and what it was played on.
      # Written whether or not it finished, since a shard that ended badly is
      # the one that gets looked into.
      - name: Write the manifest
        if: always()
        env:
          FASTCHESS: ${{ steps.tools.outputs.fastchess }}
        run: |
          # asked for again rather than read from the step that worked out the
          # slice, since this is written whether or not that step ran
          book_file=$(scripts/book.sh file "$BOOK") || book_file=unknown
          book_sha=$(sha256sum "tools/${book_file}" | cut -d' ' -f1) || book_sha=unknown
          toolchain=$(rustc -V) || toolchain=unknown
          {
            echo "candidate: ${CANDIDATE}"
            echo "candidate_sha: ${CANDIDATE_SHA}"
            echo "baseline: ${PREVIOUS}"
            echo "baseline_sha: ${BASELINE_SHA}"
            echo "build: scripts/build_at.sh, cargo build --release on an export of the commit"
            echo "fastchess: ${FASTCHESS}"
            echo "book: ${book_file}"
            echo "book_sha256: ${book_sha}"
            echo "book_openings: ${OPENINGS:-not counted, the shard did not get that far}"
            echo "seed: ${SEED}"
            echo "shard: ${SHARD}"
            echo "start: ${START:-not chosen, the shard did not get that far}"
            echo "pairs: ${PAIRS}"
            echo "time_control: ${TIME_CONTROL}"
            echo "hash_mb: ${HASH}"
            echo "concurrency: ${CONCURRENCY}"
            echo "games_asked: $((PAIRS * 2))"
            if [ "$SPRT" = "true" ]; then
              echo "sprt: judged by the summary over the pooled pairs, not by fastchess: elo0=${ELO0} elo1=${ELO1} alpha=0.05 beta=0.05 model=logistic prior_pairs=${PRIOR_PAIRS:-none}"
            else
              echo "sprt: off"
            fi
            echo "wall_clock_cap_minutes: ${MAX_MATCH_MINUTES}"
            # unset when the play step never got to the end, which is worth
            # saying rather than leaving the games to look as if they ran out
            echo "stopped_by: ${STOPPED_BY:-not recorded, the shard did not finish}"
            echo "runner: $(uname -a)"
            echo "cores: $(nproc)"
            echo "rustc: ${toolchain}"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > tools/manifest.txt
          cat tools/manifest.txt

      # The games are the only record of what actually happened, and the
      # summary job reads them back out of here rather than from a workspace it
      # does not share. The attempt is in the name because an artifact cannot
      # be uploaded twice under one name, and a rerun of the job keeps the run
      # id: with the same seed it replays the same schedule, so both attempts
      # are worth having
      - name: Keep the games
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strength-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            tools/games.pgn
            tools/result.txt
            tools/config.json
            tools/manifest.txt
          if-no-files-found: warn

  summarise:
    needs: [resolve, play]
    # a shard that timed out or failed leaves the others worth reading, so this
    # runs on whatever arrived rather than only on a clean sweep. It still
    # wants a baseline, which is what resolve says
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.baseline_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      line: ${{ steps.summary.outputs.line }}
    env:
      SHARDS: ${{ needs.resolve.outputs.count }}
      TIME_CONTROL: ${{ inputs.time_control }}
      SPRT: ${{ inputs.sprt }}
      ELO0: ${{ inputs.elo0 }}
      ELO1: ${{ inputs.elo1 }}
      PRIOR_PAIRS: ${{ inputs.prior_pairs }}
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate_name }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      PREVIOUS: ${{ needs.resolve.outputs.baseline_name }}
      BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # one directory per artifact under shards/, which is where the estimate
      # reads a shard's name from. A single artifact is the exception: it is
      # extracted straight into shards/, and the find below takes it either
      # way. The attempt is in the pattern so that a rerun reads its own games
      # rather than counting an earlier attempt's openings twice
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: strength-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: shards

      - name: Summarise the result
        id: summary
        run: |
          mapfile -t games < <(find shards -name games.pgn 2>/dev/null | sort)
          if [ "${#games[@]}" -eq 0 ]; then
            echo "::error::no shard of attempt ${GITHUB_RUN_ATTEMPT} uploaded any games. Rerunning the failed jobs alone leaves the shards on the attempt that played them, so rerun all of them."
            exit 1
          fi
          # The estimate is over every shard's games, counted from the games
          # themselves rather than taken from a result block that only saw one
          # of them. How the games ended is counted the same way: the losses a
          # crash or the clock cost stay in the estimate, because choosing what
          # to count after seeing it is not a measurement, and the counts sit
          # beside it instead. Anything worth an alert comes back on stderr.
          #
          # An sprt reads the same pooled pairs a second way, as this batch
          # of a sequential test: the estimate adds them to the pairs the
          # earlier batches played and judges the ratio over all of them
          # against the bounds. fastchess never ran the test, so there is no
          # result block to take a verdict from and no second reading to
          # disagree with this one
          estimate=(python3 scripts/match_estimate.py "${games[@]}"
                    --candidate "$CANDIDATE" --baseline "$PREVIOUS"
                    --tc "$TIME_CONTROL")
          if [ "$SPRT" = "true" ]; then
            estimate+=(--elo0 "$ELO0" --elo1 "$ELO1" --prior-pairs "$PRIOR_PAIRS")
          fi
          "${estimate[@]}" > report.md 2> remarks.txt \
            || { echo "::error::the games could not be read"; cat remarks.txt; exit 1; }
          while read -r remark; do
            echo "::warning::${remark}"
          done < remarks.txt

          trailer=$("${estimate[@]}" --trailer)
          line="Performance compared to ${PREVIOUS} | $("${estimate[@]}" --line)"
          echo "::notice::$line"
          echo "line=${line}" >> "$GITHUB_OUTPUT"
          {
            echo "${CANDIDATE} (\`${CANDIDATE_SHA:0:8}\`) against ${PREVIOUS} (\`${BASELINE_SHA:0:8}\`),"
            echo "over ${#games[@]} of ${SHARDS} shards at ${TIME_CONTROL}."
            echo
            cat report.md
            echo
            echo "As the trailer for the commit that made the difference:"
            echo
            echo '```'
            echo "$trailer"
            echo '```'
            echo
            echo "The games, the results and a manifest of what each shard played are kept"
            echo "as the \`strength-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-shard-<i>\` artifacts. The"
            echo "openings came from seed ${SEED}, which replays this schedule."
          } >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    needs: summarise
    if: inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
    with:
      marker: arche:strength
      line: ${{ needs.summarise.outputs.line }}
