name: Docker

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # a tag is published by the release workflow calling this one, so that the
  # image is only built once the tests have passed and the release exists
  workflow_call:
    inputs:
      release:
        description: Add the published image to the release notes for this tag
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-lichess-bot

# Two pushes in quick succession would otherwise race to publish the same tags.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The arm64 half of the published image is built under emulation, which is
    # slow enough to be worth a ceiling.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the engine version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: ARCHE_VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: arche-lichess-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker/smoke_test.sh arche-lichess-bot:test

      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: ARCHE_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The strength workflow appends to the same release notes, and the edit is a
  # read and a write rather than an append, so the two have to take turns.
  release-notes:
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-notes-${{ github.ref }}
    steps:
      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          # the marker is an html comment, so it does not render but does let a
          # rerun replace the line it wrote last time rather than add another
          line="Docker image: \`$IMAGE\` (\`$DIGEST\`) <!-- arche:image -->"
          # cat -s closes up the blank line the deleted line leaves behind
          body=$(gh release view "$GITHUB_REF_NAME" --json body -q .body \
                 | sed '/<!-- arche:image -->/d' | cat -s)
          printf '%s\n\n%s\n' "$body" "$line" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
