name: Docker

# A pull request, and a push to master, build the image and smoke test it, so
# a Dockerfile that no longer builds is found before a release rather than on
# the day. Neither publishes: the image that runs is a release's, published
# when the release workflow calls this one, so that it is only built once the
# tests have passed and the release exists. The master build is also what
# keeps the layer cache warm: a pull request can read master's cache and a
# tag can, and neither can read the other's.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:
    inputs:
      release:
        description: Publish the image for this tag, and add it to the release notes
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-lichess-bot

# a new push to the same ref makes the build in progress redundant
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The arm64 half of the published image is built under emulation, which is
    # slow enough to be worth a ceiling.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      # named here rather than where it is used, because the env context is not
      # one of the few a reusable workflow's inputs are allowed to read
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the engine version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: ARCHE_VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: arche-lichess-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker/smoke_test.sh arche-lichess-bot:test

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: inputs.release

      - name: Log in to the container registry
        if: inputs.release
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        if: inputs.release
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        if: inputs.release
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: ARCHE_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    needs: build
    if: inputs.release
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
    with:
      marker: arche:image
      line: "Docker image: `${{ needs.build.outputs.image }}` (`${{ needs.build.outputs.digest }}`)"
