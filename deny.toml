# What the dependency tree is allowed to contain.
#
# cargo-deny rather than cargo-audit because a dependency goes wrong in three
# ways (an advisory against a crate, a licence the engine's own cannot carry,
# a crate pulled from somewhere nobody chose) and cargo-audit answers only the
# first. Dependabot's pull requests say a newer version exists; this is the
# gate. It runs from .github/workflows/supply-chain.yml on every pull request
# and once a week, because an advisory is published without anyone here
# pushing anything.

[advisories]
# Vulnerabilities are always an error and have no setting of their own.
#
# Unmaintained covers every crate, not only the ones the workspace names: a
# transitive dependency runs the same code.
unmaintained = "all"
unsound = "all"
# A yank is an author withdrawing a version, not by itself a vulnerability
# (the ones that are have advisories), so it is reported rather than gated
# and an unrelated pull request is not held up by someone else's accidental
# publish.
yanked = "warn"
# An advisory read and judged not to apply goes here with the reason, as
# { id = "RUSTSEC-0000-0000", reason = "..." }.
ignore = []

[licenses]
# What the lock file resolves to, read crate by crate: nearly every crate
# offers MIT and Apache-2.0 either way round, a few Apache-2.0 alone, and
# unicode-ident is `(MIT OR Apache-2.0) AND Unicode-3.0`, hence the third
# entry.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
# The release archives carry none of the dev dependencies, but the tests
# build them and the lock file pins them, so they are read like anything
# else.
include-dev = true
# Neither workspace crate is published, which is what private means here.
# Skipping them keeps the list above a statement about dependencies alone.
private = { ignore = true }

[bans]
# Two versions of one crate in the same tree is the ecosystem's business
# (criterion and proptest disagree about a handful), so it is reported and
# not gated.
multiple-versions = "warn"
# A wildcard version requirement is a dependency on whatever is published
# next. The path dependency on arche-core is not a registry requirement.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything comes from crates.io, the default allowed registry. Denying the
# unknown means a crate that starts arriving from somewhere else has to be a
# deliberate edit here before it can build.
unknown-registry = "deny"
unknown-git = "deny"
