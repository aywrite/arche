# lichess-bot configuration baked into the arche image.
#
# The token comes from the LICHESS_BOT_TOKEN environment variable, so the
# placeholder below is never used. To change anything else, mount your own
# file over /lichess-bot/config.yml. Every option is documented in
# https://github.com/lichess-bot-devs/lichess-bot/blob/master/config.yml.default

token: "set LICHESS_BOT_TOKEN instead"
url: "https://lichess.org/"

engine:
  dir: "./engines/"
  name: "arche"
  protocol: "uci"
  # Arche answers "stop" during a search now, but not "ponderhit", so it still
  # cannot ponder.
  ponder: false

  # Arche advertises Hash, in megabytes, a Clear Hash button, a Threads fixed
  # at one, and Move Overhead, in milliseconds. Left commented out so the
  # engine keeps its own defaults; raising Hash means raising the container's
  # memory limit to match. Move Overhead starts at 50, which suits an
  # interface on the same machine, and this one plays across the network.
  # uci_options:
  #   Hash: 256
  #   Move Overhead: 100

  polyglot:
    enabled: true
    book:
      standard:
        - "engines/arche-book.bin"
    min_weight: 1
    selection: "weighted_random"
    max_depth: 8
    normalization: "none"

  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false

challenge:
  # each game is an engine process with a table of its own, 256MB unless Hash
  # above says otherwise, so the container's memory limit has to cover them all
  concurrency: 1
  sort_by: "best"
  accept_bot: true
  only_bot: false
  max_simultaneous_games_per_user: 1
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
    - classical
  modes:
    - casual
    - rated
  bullet_requires_increment: true
  min_base: 60
  max_base: 3600
  min_increment: 0
  max_increment: 180

matchmaking:
  allow_matchmaking: false
