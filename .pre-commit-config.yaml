default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # cargo directly: the hook repos that wrap it have gone unmaintained
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false
      # The trailers are described in docs/DEVELOPMENT.md. Its own python
      # rather than the system's, which on windows is a stub that only offers
      # to install one.
      - id: check-trailers
        name: check the commit trailers
        entry: python scripts/check_trailers.py
        language: python
        stages: [commit-msg]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # The changelog groups by scope, so a scope is required and has to be one
      # it knows. The lists are in docs/DEVELOPMENT.md and cliff.toml.
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          # without --verbose a rejected scope does not say which are allowed
          - --verbose
          - --force-scope
          - --scopes
          - bench,board,book,ci,deps,deps-dev,docker,docs,eval,lint,magic,release,search,tactics,uci,workspace,zobrist
