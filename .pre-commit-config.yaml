default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # Run cargo directly rather than through a hook repo, the ones that wrap it
  # have all gone unmaintained.
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false
      # An engine commit states its bench, a perf commit its speed, and an elo
      # claim comes in one shape. What each is and how to produce it is in
      # docs/DEVELOPMENT.md under commit trailers.
      # Its own python rather than the system's, which on windows is a stub
      # that only offers to install one.
      - id: check-trailers
        name: check the commit trailers
        entry: python scripts/check_trailers.py
        language: python
        stages: [commit-msg]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # The changelog groups by scope as well as by type, so a scope is required
      # and has to be one it knows about. The lists are in docs/DEVELOPMENT.md,
      # the build side of them is also in cliff.toml.
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          # without --verbose a rejected scope only says the message is not a
          # conventional commit, it does not say which scopes are allowed
          - --verbose
          - --force-scope
          - --scopes
          - bench,board,book,ci,deps,deps-dev,docker,docs,eval,lint,magic,release,search,tactics,uci,workspace,zobrist
