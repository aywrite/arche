# What a build targets when nothing says otherwise.
#
# The unqualified `x86-64` target predates popcnt, so `u64::count_ones` and
# `u64::trailing_zeros` compile to the bit twiddling sequences rather than
# to one instruction each. The evaluation counts mobility with the first and
# the generator pops bits with the second, so the engine pays for that on
# every leaf and every move. Measured over the bench: 3,956,655,791
# instructions at the plain target against 3,777,101,470 at v2, 4.54% fewer,
# with the node count identical at 4,089,373 because the flags change what
# an instruction is and not what the search looks at.
#
# v2 is sse4.2 and popcnt, which arrived with Intel's Nehalem in 2008 and
# AMD's Bulldozer in 2011. Later is not the same as newer: Core 2 was sold
# into 2011 and the first Atoms into 2013, and none of those has it. A
# machine without it needs the baseline build, which the release still ships
# and which `RUSTFLAGS= cargo build --release` still makes.
#
# A set `RUSTFLAGS` replaces this file rather than adding to it, and so does
# any other `target.<cfg>.rustflags` that matches. Two things follow. The
# release workflow names a level for every variant it builds, the baseline
# included, so each archive is built at the level its name claims whatever
# is written here. And a personal `build.rustflags` in `~/.cargo/config.toml`
# is dropped inside this repository rather than merged, which is worth
# knowing if you have been measuring at `target-cpu=native`.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v2"]
