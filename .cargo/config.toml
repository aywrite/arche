# What a build targets when nothing says otherwise.
#
# The unqualified `x86-64` target predates popcnt, so `u64::count_ones` and
# `u64::trailing_zeros` compile to bit twiddling sequences rather than one
# instruction each. The evaluation counts mobility with the first and the
# generator pops bits with the second, so the engine pays on every leaf and
# every move. Measured over the bench at a889930, when it was 4,089,373
# nodes: 3,956,655,791 instructions at the plain target against 3,777,101,470
# at v2, 4.54% fewer, with the node count identical.
#
# v2 is sse4.2 and popcnt (Intel Nehalem, 2008; AMD Bulldozer, 2011). A
# machine without it needs the baseline build, which the release still ships
# and which `RUSTFLAGS= cargo build --release` still makes.
#
# A set `RUSTFLAGS` replaces this file's flags, which is why the release
# workflow names a level for every variant it builds. A personal
# `build.rustflags` is dropped inside this repository. A personal
# `target.<cfg>.rustflags` that matches is joined to this one rather than
# replacing it, which matters if it says `target-cpu=native`.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v2"]
