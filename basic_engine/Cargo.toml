[package]
name = "basic_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
bench = false #https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options

[dependencies]
lazy_static = "1.5.0"
rand = { version = "0.9.2", features = ["small_rng"]}
smallvec = "1.15.1"

[dev-dependencies]
proptest = "1.7"
criterion = "0.7"
pretty_assertions = "1.4"
iai = "0.1"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "iai"
harness = false
