[package]
name = "arche-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The board, move generation, search and evaluation behind arche."
repository = "https://github.com/aywrite/arche"
publish = false

[lib]
bench = false #https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options

# The unsafe here is the move list's initialised prefix, the static
# exchange gain array and the `madvise` that asks for the transposition
# table's huge pages. Each carries a SAFETY note; nothing checks
# mechanically that the argument keeps holding. This lint is the half a
# compiler can check: without it the body of an `unsafe fn` is unsafe
# throughout, so a new unsafe operation inside one needs no block and gets
# no note. Miri is the other half and needs nightly, which this repository
# does not otherwise use; docs/ROADMAP.md carries it.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# A diagnostic build that records which of the search's shortcuts each
# score leaned on (src/provenance.rs). It changes no search decision and no
# node count, and nothing that plays or benches turns it on.
[features]
provenance = []

[dependencies]
smallvec = "1.15.1"

[dev-dependencies]
proptest = "1.7"
criterion = "0.7"
pretty_assertions = "1.4"

[[bench]]
name = "benchmark"
harness = false
